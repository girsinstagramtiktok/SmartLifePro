name: Build Smarty Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets, Compress Images & Inject APK Addons
        run: |
          rm -rf www android package.json package-lock.json capacitor.config.json node_modules
          mkdir -p www

          # Copiar SOLO los archivos necesarios de la app (ignorar zips, paquetes html o basura)
          cp index.html style.css manifest.json logo.png www/ 2>/dev/null || true
          cp data.js ui.js assistant.js finance.js shopping.js main.js www/ 2>/dev/null || true
          cp idle.png happy.png worried.png alert.png thinking.png listening.png broke.png www/ 2>/dev/null || true
          if [ -d "skins" ]; then cp -r skins www/; fi

          # Comprimir de verdad todas las imagenes de los robots (baja de ~90MB a ~2MB)
          for img in $(find www -type f -name "*.png"); do
            ffmpeg -y -i "$img" -vf "scale='min(380,iw)':-1" -c:v libwebp -quality 80 "${img}.webp" </dev/null >/dev/null 2>&1 && mv "${img}.webp" "$img" || true
          done

          node -e '
          const fs = require("fs");

          // Actualizar modelo de texto a openai/gpt-oss-120b (el mas potente compatible con json_schema estricto)
          if (fs.existsSync("www/assistant.js")) {
            let ast = fs.readFileSync("www/assistant.js", "utf8");
            ast = ast.replace("textModel: \x27openai/gpt-oss-20b\x27", "textModel: \x27openai/gpt-oss-120b\x27");
            fs.writeFileSync("www/assistant.js", ast);
          }

          const addonsCode = `
          (function() {
            console.log("[Smarty APK Native] Cargando mejoras exclusivas Android...");

            // 1. Estilos para desbloquear toques y mostrar boton de huella
            const st = document.createElement("style");
            st.innerHTML = "#listening-overlay:not(.active), .modal-overlay:not(.open), #custom-confirm:not(.open) { display: none !important; pointer-events: none !important; } .pin-pad .pin-btn.bio-btn-active { visibility: visible !important; pointer-events: auto !important; color: var(--primary) !important; font-size: 26px !important; }";
            document.head.appendChild(st);

            // 2. Modal para configurar API Key en Android
            window.askGroqKeyModal = function() {
              const old = document.getElementById("groq-key-modal");
              if (old) old.remove();
              const ov = document.createElement("div");
              ov.id = "groq-key-modal";
              ov.className = "modal-overlay open";
              ov.style.zIndex = "25000";
              const current = (Data?.store?.settings?.groqApiKey || "").trim();
              ov.innerHTML = \`
                <div class="settings-card" onclick="event.stopPropagation()" style="max-width:350px;">
                  <h3 style="margin:0 0 8px 0; color:var(--primary);">🔑 Clave API de Groq (Smarty AI)</h3>
                  <p style="font-size:12px; color:var(--text-sec); margin:0 0 12px 0;">Modelo activo: <b>GPT-OSS 120B + Qwen 3.8 Vision</b>.</p>
                  <input type="text" id="groq-key-input-field" class="setting-input" placeholder="gsk_..." value="\${current}" style="width:100%; margin-bottom:12px; font-family:monospace;">
                  <div style="display:flex; gap:8px;">
                    <button class="btn-danger-outline" style="margin:0; flex:1; padding:12px;" id="gk-cancel">Cerrar</button>
                    <button class="btn-full" style="margin:0; flex:1; padding:12px;" id="gk-save">Guardar Clave</button>
                  </div>
                </div>
              \`;
              document.body.appendChild(ov);
              ov.querySelector("#gk-cancel").onclick = () => ov.remove();
              ov.querySelector("#gk-save").onclick = () => {
                const val = ov.querySelector("#groq-key-input-field").value.trim();
                if (!Data.store.settings) Data.store.settings = {};
                Data.store.settings.groqApiKey = val;
                Data.save();
                if (typeof GroqAI !== "undefined") GroqAI.refreshUsagePanel();
                if (typeof UI !== "undefined") UI.showSnackbar(val ? "Smarty AI activado ✅" : "Clave borrada");
                ov.remove();
                if (typeof UI !== "undefined") UI.renderSettingsView();
              };
            };

            if (typeof GroqAI !== "undefined") {
              GroqAI.getApiKey = function() {
                if (!Data.store.settings) Data.store.settings = {};
                const stored = (Data.store.settings.groqApiKey || "").trim();
                if (stored) return stored;
                window.askGroqKeyModal();
                return null;
              };
            }

            // 3. Arreglar Crear Copia y Restaurar Copia en Android APK
            if (typeof Main !== "undefined") {
              const origBackup = Main.downloadBackup.bind(Main);
              Main.downloadBackup = function() {
                if (window.SmartyAndroid && window.SmartyAndroid.saveBackupFile) {
                  const json = Data.exportJSON();
                  const fileName = "smart_life_backup_" + new Date().toISOString().slice(0, 10) + ".json";
                  window.SmartyAndroid.saveBackupFile(json, fileName);
                  return;
                }
                origBackup();
              };
            }

            window._onAndroidBackupFileRestored = async function(jsonString) {
              try {
                const success = Data.importJSON(jsonString);
                if (success) {
                  await UI.confirm("import_success_title", "import_success_msg");
                  location.reload();
                } else {
                  UI.showSnackbar("Error: Archivo de copia inválido");
                }
              } catch (e) {
                UI.showSnackbar("Error al restaurar copia");
              }
            };

            // 4. Puente Nativo: Huella Digital y Lector de Notificaciones Bancarias
            window.NativeBridge = {
              init() {
                if (!Data.store.settings) Data.store.settings = {};
                if (typeof Data.store.settings.biometricEnabled === "undefined") Data.store.settings.biometricEnabled = false;
                if (typeof Data.store.settings.bankAutoDetect === "undefined") Data.store.settings.bankAutoDetect = false;
                if (typeof Data.store.settings.bankAutoSaveMode === "undefined") Data.store.settings.bankAutoSaveMode = "confirm";

                window.addEventListener("SmartyBankNotification", (e) => {
                  if (e && e.detail) this.processBankNotification(e.detail);
                });
              },

              toggleBiometricSetting(checked) {
                if (checked && !Data.store.settings.pin) {
                  UI.showSnackbar("Primero crea un PIN de respaldo");
                  Main.togglePinLock();
                }
                Data.store.settings.biometricEnabled = checked;
                Data.save();
                if (checked && window.SmartyAndroid?.authenticateBiometric) {
                  window.SmartyAndroid.authenticateBiometric();
                }
              },

              openNotificationAccessSettings() {
                if (window.SmartyAndroid?.openNotificationSettings) {
                  window.SmartyAndroid.openNotificationSettings();
                }
              },

              async processBankNotification(notif) {
                if (!Data.store.settings?.bankAutoDetect) return;
                const fullText = ((notif.title || "") + " - " + (notif.text || "")).trim();
                if (fullText.length < 5) return;
                const payRegex = /(compra|pago|pagaste|aprobada|aprovada|pix|transferencia|transferência|débito|debito|crédito|credito|spent|paid|r\\$|\\$)/i;
                if (!payRegex.test(fullText)) return;

                const categories = ["cat_market","cat_leisure","cat_transport","cat_clothes","cat_health","cat_bills","cat_travel","cat_beauty","cat_other"];
                let extracted = null;

                if (Data.store.settings?.groqApiKey && typeof GroqAI !== "undefined") {
                  try {
                    const schema = {
                      type: "object",
                      properties: {
                        isRealExpense: { type: "boolean" },
                        amount: { type: "number" },
                        merchant: { type: "string" },
                        category: { type: "string", enum: categories }
                      },
                      required: ["isRealExpense","amount","merchant","category"],
                      additionalProperties: false
                    };
                    extracted = await GroqAI.textJSON(
                      "Extract real payment expense from banking notification. Ignore promos. Allowed categories: " + categories.join(", "),
                      fullText, "bank_expense", schema, { maxTokens: 350 }
                    );
                    if (!extracted.isRealExpense) return;
                  } catch (_) {}
                }

                if (!extracted || !extracted.amount) {
                  const m = fullText.match(/(\\d+(?:[.,]\\d{1,2})?)/);
                  if (!m) return;
                  extracted = { amount: parseFloat(m[1].replace(",", ".")), merchant: notif.title || "Pago Bancario", category: "cat_other" };
                }

                const amount = Number(extracted.amount);
                if (!amount || amount <= 0) return;
                const desc = "🏦 " + String(extracted.merchant || "Banco").trim();
                const cat = categories.includes(extracted.category) ? extracted.category : "cat_other";

                if (Data.store.settings.bankAutoSaveMode === "auto") {
                  Data.store.expenses.push({ id: Date.now().toString(), date: Date.now(), amount, desc, category: UI.t(cat), isInstallment: false });
                  Data.save();
                  UI.renderBudgetChart();
                  Finance.renderHomeWidgets();
                  if (typeof Assistant !== "undefined") Assistant.showReactivePopup("🏦 Auto-registrado: " + UI.formatMoney(amount));
                } else {
                  Finance.openSmartExpenseModal(amount, desc, cat);
                }
              },

              simulateBankNotification() {
                Data.store.settings.bankAutoDetect = true;
                Data.save();
                this.processBankNotification({ title: "Nubank", text: "Compra aprobada en Uber Trip por 24.50" });
              }
            };

            function setupBiometricLockScreen() {
              const emptyPinBtn = document.querySelector(".pin-pad .pin-btn:nth-child(10)");
              if (emptyPinBtn && !emptyPinBtn.classList.contains("bio-btn-active")) {
                emptyPinBtn.classList.add("bio-btn-active");
                emptyPinBtn.innerHTML = "🫆";
                emptyPinBtn.onclick = () => {
                  if (window.SmartyAndroid?.authenticateBiometric) window.SmartyAndroid.authenticateBiometric();
                };
              }
              if ((Data?.store?.settings?.pin || Data?.store?.settings?.biometricEnabled) && window.SmartyAndroid?.authenticateBiometric) {
                setTimeout(() => window.SmartyAndroid.authenticateBiometric(), 400);
              }
            }

            function hookSettingsUI() {
              if (typeof UI === "undefined" || !UI.renderSettingsView) return;
              const origRender = UI.renderSettingsView.bind(UI);
              UI.renderSettingsView = function() {
                origRender();

                // Conectar el boton Restaurar Copia al selector nativo de Android para que nunca falle
                const restoreInput = document.getElementById("restore-input");
                if (restoreInput && window.SmartyAndroid && window.SmartyAndroid.pickRestoreFile) {
                  restoreInput.onclick = (e) => {
                    e.preventDefault();
                    window.SmartyAndroid.pickRestoreFile();
                  };
                }

                const container = document.getElementById("settings-inject");
                if (!container || document.getElementById("android-pro-settings")) return;
                const s = Data.store.settings || {};
                const hasKey = !!(s.groqApiKey && s.groqApiKey.trim());
                const panel = document.createElement("div");
                panel.id = "android-pro-settings";
                panel.style.marginBottom = "20px";
                panel.innerHTML = \`
                  <div class="section-label">OPCIONES ANDROID & SMARTY AI</div>
                  <div class="glass-card" style="padding:15px; margin:0;">
                    <div class="setting-item">
                      <span>🔑 API Key de Groq (GPT-OSS 120B)</span>
                      <button class="text-btn-small" style="background:var(--input-bg);" onclick="window.askGroqKeyModal()">\${hasKey ? "Configurada ✅" : "Poner Clave ➕"}</button>
                    </div>
                    <div class="setting-item">
                      <span>🫆 Desbloqueo con Huella / Rostro</span>
                      <label class="switch-wrap">
                        <input type="checkbox" \${s.biometricEnabled ? "checked" : ""} onchange="NativeBridge.toggleBiometricSetting(this.checked)">
                        <span class="slider"></span>
                      </label>
                    </div>
                    <div class="setting-item">
                      <span>🏦 Leer Notificaciones de Bancos</span>
                      <label class="switch-wrap">
                        <input type="checkbox" \${s.bankAutoDetect ? "checked" : ""} onchange="Data.store.settings.bankAutoDetect = this.checked; Data.save(); if(this.checked) NativeBridge.openNotificationAccessSettings();">
                        <span class="slider"></span>
                      </label>
                    </div>
                    <div class="setting-item">
                      <span>Modo de Registro Bancario</span>
                      <select class="setting-select" style="width:auto; margin:0; padding:6px 10px; font-size:12px;" onchange="Data.store.settings.bankAutoSaveMode = this.value; Data.save();">
                        <option value="confirm" \${s.bankAutoSaveMode !== "auto" ? "selected" : ""}>Confirmar antes</option>
                        <option value="auto" \${s.bankAutoSaveMode === "auto" ? "selected" : ""}>Guardar 100% solo</option>
                      </select>
                    </div>
                    <div style="display:flex; gap:8px; margin-top:10px;">
                      <button class="btn-data" style="padding:10px; font-size:12px;" onclick="NativeBridge.openNotificationAccessSettings()">⚙️ Permiso Bancos</button>
                      <button class="btn-data" style="padding:10px; font-size:12px;" onclick="NativeBridge.simulateBankNotification()">⚡ Probar Pago</button>
                    </div>
                  </div>
                \`;
                container.insertBefore(panel, container.firstChild);
              };
            }

            window.addEventListener("load", () => {
              hookSettingsUI();
              setTimeout(() => {
                NativeBridge.init();
                setupBiometricLockScreen();
                if (typeof UI !== "undefined") UI.renderSettingsView();
              }, 400);
            });
          })();
          `;

          fs.writeFileSync("www/smarty-pro-addons.js", addonsCode);

          if (fs.existsSync("www/index.html")) {
            let html = fs.readFileSync("www/index.html", "utf8");
            html = html.replace(/serviceWorker/g, "serviceWorkerDisabledInAPK");
            html = html.replace("main.js\"></script>", "main.js\"></script><script src=\"smarty-pro-addons.js\"></script>");
            fs.writeFileSync("www/index.html", html);
          }

          fs.writeFileSync("capacitor.config.json", JSON.stringify({
            appId: "com.smartlife.pro",
            appName: "Smart Life Pro",
            webDir: "www"
          }, null, 2));
          '

          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2 @capacitor/local-notifications@6.1.0 @capacitor/preferences@6.0.2
          npx cap add android
          npx cap sync android

      - name: Set App Icon, Optimize APK Size & Inject Native File Picker + Biometrics
        run: |
          if [ -f "logo.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in android/app/src/main/res/mipmap-*; do
              if [ -d "$d" ]; then
                ffmpeg -y -i logo.png -vf scale=192:192 "$d/ic_launcher.png" </dev/null >/dev/null 2>&1 || cp logo.png "$d/ic_launcher.png"
                ffmpeg -y -i logo.png -vf scale=192:192 "$d/ic_launcher_round.png" </dev/null >/dev/null 2>&1 || cp logo.png "$d/ic_launcher_round.png"
                ffmpeg -y -i logo.png -vf scale=192:192 "$d/ic_launcher_foreground.png" </dev/null >/dev/null 2>&1 || cp logo.png "$d/ic_launcher_foreground.png"
              fi
            done
          fi

          node -e '
          const fs = require("fs");
          const pkgDir = "android/app/src/main/java/com/smartlife/pro";
          fs.mkdirSync(pkgDir, { recursive: true });

          // Reducir peso del APK compilando solo para arquitecturas moviles ARM (quita x86 de PC)
          let buildGradle = fs.readFileSync("android/app/build.gradle", "utf8");
          buildGradle = buildGradle.replace("defaultConfig {", "defaultConfig {\n        ndk {\n            abiFilters \x27arm64-v8a\x27, \x27armeabi-v7a\x27\n        }");
          fs.writeFileSync("android/app/build.gradle", buildGradle);

          const notifService = [
            "package com.smartlife.pro;",
            "import android.app.Notification;",
            "import android.os.Bundle;",
            "import android.service.notification.NotificationListenerService;",
            "import android.service.notification.StatusBarNotification;",
            "import android.content.Intent;",
            "public class SmartyNotificationService extends NotificationListenerService {",
            "    @Override",
            "    public void onNotificationPosted(StatusBarNotification sbn) {",
            "        if (sbn == null) return;",
            "        String pkg = sbn.getPackageName();",
            "        if (pkg == null || pkg.equals(\"com.smartlife.pro\")) return;",
            "        if (sbn.getNotification() == null || sbn.getNotification().extras == null) return;",
            "        Bundle extras = sbn.getNotification().extras;",
            "        CharSequence titleCs = extras.getCharSequence(Notification.EXTRA_TITLE);",
            "        CharSequence textCs = extras.getCharSequence(Notification.EXTRA_TEXT);",
            "        String title = titleCs != null ? titleCs.toString() : \"\";",
            "        String text = textCs != null ? textCs.toString() : \"\";",
            "        if (title.isEmpty() && text.isEmpty()) return;",
            "        Intent intent = new Intent(\"SMARTY_BANK_NOTIFICATION\");",
            "        intent.setPackage(getPackageName());",
            "        intent.putExtra(\"package\", pkg);",
            "        intent.putExtra(\"title\", title);",
            "        intent.putExtra(\"text\", text);",
            "        sendBroadcast(intent);",
            "    }",
            "}"
          ].join("\n");

          const mainActivity = [
            "package com.smartlife.pro;",
            "import android.Manifest;",
            "import android.app.Activity;",
            "import android.content.BroadcastReceiver;",
            "import android.content.Context;",
            "import android.content.DialogInterface;",
            "import android.content.Intent;",
            "import android.content.IntentFilter;",
            "import android.content.pm.PackageManager;",
            "import android.hardware.biometrics.BiometricPrompt;",
            "import android.net.Uri;",
            "import android.os.Build;",
            "import android.os.Bundle;",
            "import android.os.CancellationSignal;",
            "import android.provider.Settings;",
            "import android.util.Base64;",
            "import android.webkit.JavascriptInterface;",
            "import androidx.core.app.ActivityCompat;",
            "import androidx.core.content.ContextCompat;",
            "import com.getcapacitor.BridgeActivity;",
            "import java.io.BufferedReader;",
            "import java.io.InputStream;",
            "import java.io.InputStreamReader;",
            "import java.io.OutputStream;",
            "import java.nio.charset.StandardCharsets;",
            "import org.json.JSONObject;",
            "public class MainActivity extends BridgeActivity {",
            "    private BroadcastReceiver bankReceiver;",
            "    private static final int PICK_RESTORE_JSON = 9901;",
            "    private static final int CREATE_BACKUP_JSON = 9902;",
            "    private String pendingBackupContent = \"\";",
            "    public class SmartyJSBridge {",
            "        @JavascriptInterface",
            "        public void openNotificationSettings() {",
            "            Intent intent = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);",
            "            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);",
            "            startActivity(intent);",
            "        }",
            "        @JavascriptInterface",
            "        public void pickRestoreFile() {",
            "            Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);",
            "            intent.addCategory(Intent.CATEGORY_OPENABLE);",
            "            intent.setType(\"*/*\");",
            "            startActivityForResult(intent, PICK_RESTORE_JSON);",
            "        }",
            "        @JavascriptInterface",
            "        public void saveBackupFile(String jsonContent, String fileName) {",
            "            pendingBackupContent = jsonContent;",
            "            Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);",
            "            intent.addCategory(Intent.CATEGORY_OPENABLE);",
            "            intent.setType(\"application/json\");",
            "            intent.putExtra(Intent.EXTRA_TITLE, fileName);",
            "            startActivityForResult(intent, CREATE_BACKUP_JSON);",
            "        }",
            "        @JavascriptInterface",
            "        public void authenticateBiometric() {",
            "            runOnUiThread(new Runnable() {",
            "                @Override",
            "                public void run() {",
            "                    try {",
            "                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {",
            "                            BiometricPrompt prompt = new BiometricPrompt.Builder(MainActivity.this)",
            "                                .setTitle(\"Desbloquear Smart Life Pro\")",
            "                                .setSubtitle(\"Usa tu huella o rostro para entrar\")",
            "                                .setNegativeButton(\"Usar PIN\", getMainExecutor(), new DialogInterface.OnClickListener() {",
            "                                    @Override",
            "                                    public void onClick(DialogInterface dialog, int which) {}",
            "                                })",
            "                                .build();",
            "                            prompt.authenticate(new CancellationSignal(), getMainExecutor(), new BiometricPrompt.AuthenticationCallback() {",
            "                                @Override",
            "                                public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {",
            "                                    getBridge().getWebView().post(new Runnable() {",
            "                                        @Override",
            "                                        public void run() {",
            "                                            getBridge().getWebView().evaluateJavascript(\"if(window.Main) Main.unlockApp();\", null);",
            "                                        }",
            "                                    });",
            "                                }",
            "                            });",
            "                        }",
            "                    } catch (Exception ignored) {}",
            "                }",
            "            });",
            "        }",
            "    }",
            "    @Override",
            "    protected void onActivityResult(int requestCode, int resultCode, Intent data) {",
            "        super.onActivityResult(requestCode, resultCode, data);",
            "        if (requestCode == PICK_RESTORE_JSON && resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {",
            "            try {",
            "                Uri uri = data.getData();",
            "                InputStream is = getContentResolver().openInputStream(uri);",
            "                BufferedReader reader = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));",
            "                StringBuilder sb = new StringBuilder();",
            "                String line;",
            "                while ((line = reader.readLine()) != null) sb.append(line).append(\"\\n\");",
            "                reader.close();",
            "                String b64 = Base64.encodeToString(sb.toString().getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);",
            "                final String js = \"if(window._onAndroidBackupFileRestored) window._onAndroidBackupFileRestored(decodeURIComponent(escape(atob(\x27\" + b64 + \"\x27))));\";",
            "                getBridge().getWebView().post(new Runnable() {",
            "                    @Override",
            "                    public void run() {",
            "                        getBridge().getWebView().evaluateJavascript(js, null);",
            "                    }",
            "                });",
            "            } catch (Exception ignored) {}",
            "        } else if (requestCode == CREATE_BACKUP_JSON && resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {",
            "            try {",
            "                Uri uri = data.getData();",
            "                OutputStream os = getContentResolver().openOutputStream(uri);",
            "                os.write(pendingBackupContent.getBytes(StandardCharsets.UTF_8));",
            "                os.close();",
            "                getBridge().getWebView().post(new Runnable() {",
            "                    @Override",
            "                    public void run() {",
            "                        getBridge().getWebView().evaluateJavascript(\"if(window.UI) UI.showSnackbar(\x27Copia guardada correctamente ✅\x27);\", null);",
            "                    }",
            "                });",
            "            } catch (Exception ignored) {}",
            "        }",
            "    }",
            "    @Override",
            "    protected void onCreate(Bundle savedInstanceState) {",
            "        super.onCreate(savedInstanceState);",
            "        if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {",
            "            ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA, Manifest.permission.POST_NOTIFICATIONS}, 101);",
            "        }",
            "        getBridge().getWebView().addJavascriptInterface(new SmartyJSBridge(), \"SmartyAndroid\");",
            "        bankReceiver = new BroadcastReceiver() {",
            "            @Override",
            "            public void onReceive(Context context, Intent intent) {",
            "                try {",
            "                    JSONObject obj = new JSONObject();",
            "                    obj.put(\"package\", intent.getStringExtra(\"package\"));",
            "                    obj.put(\"title\", intent.getStringExtra(\"title\"));",
            "                    obj.put(\"text\", intent.getStringExtra(\"text\"));",
            "                    final String js = \"window.dispatchEvent(new CustomEvent(\x27SmartyBankNotification\x27, { detail: \" + obj.toString() + \" }));\";",
            "                    getBridge().getWebView().post(new Runnable() {",
            "                        @Override",
            "                        public void run() {",
            "                            getBridge().getWebView().evaluateJavascript(js, null);",
            "                        }",
            "                    });",
            "                } catch (Exception ignored) {}",
            "            }",
            "        };",
            "        IntentFilter filter = new IntentFilter(\"SMARTY_BANK_NOTIFICATION\");",
            "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {",
            "            registerReceiver(bankReceiver, filter, Context.RECEIVER_NOT_EXPORTED);",
            "        } else {",
            "            registerReceiver(bankReceiver, filter);",
            "        }",
            "    }",
            "    @Override",
            "    public void onDestroy() {",
            "        if (bankReceiver != null) unregisterReceiver(bankReceiver);",
            "        super.onDestroy();",
            "    }",
            "}"
          ].join("\n");

          fs.writeFileSync(pkgDir + "/SmartyNotificationService.java", notifService);
          fs.writeFileSync(pkgDir + "/MainActivity.java", mainActivity);

          let manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          if (!manifest.includes("USE_BIOMETRIC")) {
              manifest = manifest.replace("<application", "<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.USE_BIOMETRIC\" />\n    <uses-permission android:name=\"android.permission.USE_FINGERPRINT\" />\n    <application");
          }
          if (!manifest.includes("SmartyNotificationService")) {
              const serviceTag = "<service android:name=\".SmartyNotificationService\" android:label=\"Smarty Lector Bancario\" android:exported=\"true\" android:permission=\"android.permission.BIND_NOTIFICATION_LISTENER_SERVICE\"><intent-filter><action android:name=\"android.service.notification.NotificationListenerService\" /></intent-filter></service>\n    </application>";
              manifest = manifest.replace("</application>", serviceTag);
          }
          fs.writeFileSync("android/app/src/main/AndroidManifest.xml", manifest);
          '

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLifePro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
