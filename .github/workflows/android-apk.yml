            "        if (sbn.getNotification() == null || sbn.getNotification().extras == null) return;",
            "        Bundle extras = sbn.getNotification().extras;",
            "        CharSequence titleCs = extras.getCharSequence(Notification.EXTRA_TITLE);",
            "        CharSequence textCs = extras.getCharSequence(Notification.EXTRA_TEXT);",
            "        String title = titleCs != null ? titleCs.toString() : \"\";",
            "        String text = textCs != null ? textCs.toString() : \"\";",
            "        if (title.isEmpty() && text.isEmpty()) return;",
            "        if (pkg.equals(\"com.smartlife.pro\") && !title.contains(\"Compra\")) return;",
            "        try {",
            "            SharedPreferences prefs = getSharedPreferences(\"smarty_bank_queue\", MODE_PRIVATE);",
            "            String raw = prefs.getString(\"queue\", \"[]\");",
            "            JSONArray arr = new JSONArray(raw);",
            "            JSONObject item = new JSONObject();",
            "            item.put(\"package\", pkg);",
            "            item.put(\"title\", title);",
            "            item.put(\"text\", text);",
            "            arr.put(item);",
            "            prefs.edit().putString(\"queue\", arr.toString()).apply();",
            "        } catch (Exception ignored) {}",
            "        Intent intent = new Intent(\"SMARTY_BANK_NOTIFICATION\");",
            "        intent.setPackage(getPackageName());",
            "        intent.putExtra(\"package\", pkg);",
            "        intent.putExtra(\"title\", title);",
            "        intent.putExtra(\"text\", text);",
            "        sendBroadcast(intent);",
            "    }",
            "}"
          ].join("\n");
