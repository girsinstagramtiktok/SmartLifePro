name: Build Smarty Android APK
on:
  # Una unica compilacion manual cuando cambia algo nativo; los cambios web van via OTA.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install ImageMagick, Compress to 5MB & Inject V21 Master Addons
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          rm -rf www android package.json package-lock.json capacitor.config.json node_modules
          mkdir -p www

          cp index.html style.css manifest.json logo.png www/ 2>/dev/null || true
          cp data.js ui.js assistant.js finance.js shopping.js main.js bank-bridge.js camera-bridge.js ota-client.js www/
          printf "window.SMARTY_OTA_REPOSITORY = %s;\n" "$(node -p 'JSON.stringify(process.env.GITHUB_REPOSITORY || "")')" > www/ota-config.js
          cp idle.png happy.png worried.png alert.png thinking.png listening.png broke.png www/ 2>/dev/null || true
          if [ -d "skins" ]; then cp -r skins www/; fi

          find www -type f -name "*.png" -exec mogrify -strip -resize "360x360>" -quality 82 {} +

          cat << 'EOF_SCRIPT' > inject_apk.js
          const fs = require("fs");

          if (fs.existsSync("www/assistant.js")) {
            let ast = fs.readFileSync("www/assistant.js", "utf8");
            ast = ast.replace("maxTokens = 650", "maxTokens = 2500");
            fs.writeFileSync("www/assistant.js", ast);
          }

          const addons = [
            "(function() {",
            "  window.SMARTY_APK_VERSION = '21.0';",
            "  document.getElementById('fin-bank-summary-banner')?.remove();",
            "  document.getElementById('pace-day-marker')?.remove();",
            "  document.getElementById('smarty-master-styles')?.remove();",
            "",
            "  // 0. RESTAURAR Y CREAR COPIA DE SEGURIDAD FUNCIONAL AL 100%",
            "  window._onAndroidBackupFileRestored = async function(jsonString) {",
            "    try {",
            "      if (!jsonString || typeof jsonString !== 'string') { UI.showSnackbar('Error: Archivo vacío'); return; }",
            "      if (Data.importJSON(jsonString.trim())) {",
            "        Data.save();",
            "        UI.showSnackbar('✅ Copia restaurada con éxito. Recargando...');",
            "        setTimeout(() => location.reload(), 800);",
            "      } else {",
            "        UI.showSnackbar('❌ Archivo de copia inválido');",
            "      }",
            "    } catch(e) { UI.showSnackbar('❌ Error al restaurar copia'); }",
            "  };",
            "",
            "  if (typeof Main !== 'undefined') {",
            "    Main.downloadBackup = function() {",
            "      const json = Data.exportJSON();",
            "      if (window.SmartyAndroid?.saveSingleOverwriteBackup) window.SmartyAndroid.saveSingleOverwriteBackup(json);",
            "      if (window.SmartyAndroid?.saveBackupFile) { window.SmartyAndroid.saveBackupFile(json, 'SmartLifePro_Backup.json'); return; }",
            "      UI.showSnackbar('✅ Copia guardada en Descargas');",
            "    };",
            "    Main.handleImport = function(input) {",
            "      const file = input?.files?.[0]; if (!file) return;",
            "      const reader = new FileReader();",
            "      reader.onload = (e) => window._onAndroidBackupFileRestored(e.target.result);",
            "      reader.readAsText(file);",
            "      input.value = '';",
            "    };",
            "  }",
            "",
            "  // 1. ESTILOS COMPLETOS",
            "  const st = document.createElement('style');",
            "  st.id = 'smarty-master-styles';",
            "  st.innerHTML = [",
            "    '#listening-overlay:not(.active), .modal-overlay:not(.open), #custom-confirm:not(.open) { display:none !important; pointer-events:none !important; }',",
            "    '.pin-pad .pin-btn.bio-btn-active { visibility:visible !important; pointer-events:auto !important; color:var(--primary) !important; font-size:11px !important; font-weight:800 !important; }',",
            "    'body.dark-mode { --bg-body:#05070B !important; --glass-bg:linear-gradient(145deg, rgba(24,32,48,0.92) 0%, rgba(14,19,30,0.95) 100%) !important; --item-bg:#111726 !important; --input-bg:#192236 !important; }',",
            "    'body.dark-mode .glass-card, body.dark-mode .item-row, body.dark-mode .mascot-compact-row { background:linear-gradient(145deg, rgba(26,35,52,0.92), rgba(15,21,33,0.95)) !important; border-top:1px solid rgba(255,255,255,0.16) !important; box-shadow:0 14px 34px rgba(0,0,0,0.55) !important; }',",
            "    '#budget-circle { filter:none !important; box-shadow:none !important; }',",
            "    '#pace-day-marker, #fin-bank-summary-banner, #settings-inject .setting-group, #settings-inject .div-line { display:none !important; }',",
            "    '.xp-fill-vertical { background:linear-gradient(to top, #F59E0B, #FDE047) !important; box-shadow:0 0 10px rgba(251,191,36,0.6) !important; }',",
            "    '.bottom-dock .dock-btn.active { background:rgba(0,110,230,0.14) !important; border-radius:18px !important; padding:8px !important; transform:translateY(-2px) !important; }',",
            "    '.tone-orange { color:#EA580C; background:rgba(234,88,12,0.14); }',",
            "    '.tone-crimson { color:#E11D48; background:rgba(225,29,72,0.14); }',",
            "    '.tone-ant { color:#D97706; background:rgba(217,119,6,0.15); }',",
            "    '.brand-logo-real { width:38px; height:38px; border-radius:11px; display:inline-flex; align-items:center; justify-content:center; margin-right:12px; flex-shrink:0; overflow:hidden; box-shadow:0 3px 8px rgba(0,0,0,0.12); }',",
            "    '.brand-logo-real svg, .brand-logo-real img { width:100%; height:100%; object-fit:cover; display:block; }',",
            "    '#smarty-chat-box > div { max-width:84% !important; box-sizing:border-box !important; overflow-wrap:anywhere !important; word-break:break-word !important; white-space:normal !important; overflow-x:hidden !important; }',",
            "    '#smarty-chat-mic-btn.listening { background:var(--danger) !important; color:#fff !important; transform:scale(1.08); }',",
            "    '.quick-cat-switcher { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:12px; padding-top:12px; border-top:1px dashed rgba(120,120,120,0.2); }',",
            "    '.quick-cat-pill { display:inline-flex; align-items:center; gap:5px; padding:6px 10px; border-radius:12px; font-size:11.5px; font-weight:700; background:var(--input-bg); color:var(--text-color); cursor:pointer; }',",
            "    '.quick-cat-pill.active-cat { background:var(--primary); color:#fff; }',",
            "    '.quick-cat-pill.active-cat .category-icon-shell { background:rgba(255,255,255,0.22); color:#fff; }',",
            "    '.chart-legend-interactive { padding:7px 10px; border-radius:12px; cursor:pointer; transition:0.15s; }',",
            "    '.chart-legend-interactive:active { transform:scale(0.98); background:var(--input-bg); }',",
            "    '.chart-legend-interactive.active-filter-row { background:rgba(0,110,230,0.12); border:1px solid rgba(0,110,230,0.3); }'",
            "  ].join('\\n');",
            "  document.head.appendChild(st);",
            "",
            "  const ALL_CAT_IDS = ['cat_market','cat_lunch','cat_dining','cat_leisure','cat_transport','cat_clothes','cat_health','cat_bills','cat_travel','cat_beauty','cat_other'];",
            "",
            "  // 2. ESCANER DE TICKET COMPLETO (CREA O SUSTITUYE LA LISTA POR LOS PRODUCTOS Y PRECIOS DEL TICKET)",
            "  function upgradeReceiptTicketReplacement() {",
            "    if (typeof Shopping === 'undefined') return;",
            "",
            "    Shopping.extractFullReceiptWithAI = async function(file) {",
            "      const base64Data = await Finance.compressImage(file, 1200, 0.78);",
            "      const rawBase64 = base64Data.split(',')[1];",
            "      const prompt = 'Analyze this supermarket/store receipt image. Extract store name (if visible), final total paid, and EVERY purchased item with its quantity and unit price. Convert abbreviated receipt names into clean readable product names. Return ONLY valid JSON: {\"storeName\": \"Supermercado\", \"receiptTotal\": 125.40, \"items\": [{\"name\": \"Leche\", \"qty\": \"2\", \"unitPrice\": 4.50}]}';",
            "      const res = await GroqAI.visionJSON(prompt, rawBase64);",
            "      const rawItems = Array.isArray(res?.items) ? res.items : [];",
            "      if (!rawItems.length) throw new Error('EMPTY_RECEIPT');",
            "      const cleanItems = rawItems.map(i => {",
            "        const nm = String(i.name || 'Producto').trim();",
            "        const pr = Number(i.unitPrice) > 0 ? Number(i.unitPrice) : 0;",
            "        const qRaw = String(i.qty || '1').trim();",
            "        const qFmt = (!isNaN(qRaw) && Number(qRaw) > 1) ? 'x' + qRaw : (qRaw === '1' ? '' : qRaw);",
            "        if (pr > 0) Data.store.prices[this.normalize(nm)] = pr;",
            "        return { name: nm.charAt(0).toUpperCase() + nm.slice(1), qty: qFmt, checked: true, price: pr };",
            "      });",
            "      return { storeName: String(res?.storeName || '').trim(), receiptTotal: Number(res?.receiptTotal) > 0 ? Number(res.receiptTotal) : 0, items: cleanItems };",
            "    };",
            "",
            "    // Al finalizar una lista activa con Camara o Galeria: sustituye toda la lista por los productos y precios del ticket",
            "    Shopping.handleReceiptPhoto = async function(input) {",
            "      const file = input?.files?.[0]; if (!file) return;",
            "      if (typeof GroqAI === 'undefined' || !GroqAI.getApiKey()) return;",
            "      const statusEl = document.getElementById('receipt-scan-status');",
            "      if (statusEl) statusEl.innerText = '⏳ Extrayendo todos los productos y precios del ticket...';",
            "      UI.showSnackbar('⏳ Leyendo ticket completo...');",
            "      const camInput = document.getElementById('receipt-photo-cam'); if (camInput) camInput.value = '';",
            "      const galInput = document.getElementById('receipt-photo-gal'); if (galInput) galInput.value = '';",
            "      try {",
            "        const parsed = await this.extractFullReceiptWithAI(file);",
            "        const list = Data.store.lists.find(l => l.id === Data.store.currentId);",
            "        if (!list) throw new Error('Lista no encontrada');",
            "        list.items = parsed.items;",
            "        if (parsed.storeName) list.name = parsed.storeName.slice(0, 40);",
            "        Data.save();",
            "        this.renderShoppingItems();",
            "        this.renderFinishItems(list.items);",
            "        if (parsed.receiptTotal > 0) {",
            "          const manualInput = document.getElementById('finish-manual-total');",
            "          if (manualInput) manualInput.value = parsed.receiptTotal.toFixed(2);",
            "          this.updateFinishTotal();",
            "        }",
            "        if (statusEl) statusEl.innerText = '✅ Lista sustituida por ' + parsed.items.length + ' productos del ticket';",
            "        UI.showSnackbar('✨ ' + parsed.items.length + ' productos y precios cargados del ticket');",
            "      } catch(err) {",
            "        if (statusEl) statusEl.innerText = '';",
            "        UI.showSnackbar('No se pudieron extraer los productos de la foto');",
            "      }",
            "    };",
            "",
            "    // Modal para elegir Camara o Galeria al tocar el boton 📸 Ticket en Mis Listas",
            "    Shopping.openTicketSourceModal = function() {",
            "      document.getElementById('ticket-source-modal')?.remove();",
            "      const ov = document.createElement('div'); ov.id = 'ticket-source-modal'; ov.className = 'modal-overlay open'; ov.style.zIndex = '25000';",
            "      ov.innerHTML = '<div class=\"settings-card\" onclick=\"event.stopPropagation()\" style=\"max-width:340px; text-align:center;\">' +",
            "        '<h3 style=\"margin:0 0 8px; color:var(--primary);\">📸 Crear Lista desde Ticket</h3>' +",
            "        '<p style=\"font-size:12px; color:var(--text-sec); margin:0 0 16px;\">Toma una foto al recibo del supermercado o elígela de tu galería para armar la lista ya con todos los precios:</p>' +",
            "        '<div style=\"display:flex; gap:10px; margin-bottom:12px;\">' +",
            "          '<button type=\"button\" class=\"btn-data\" style=\"margin:0; padding:14px; flex:1; border:1.5px dashed var(--primary);\" onclick=\"SmartyCamera.take(\\x27list-new\\x27)\"><span style=\"font-size:22px;\">📷</span><span>Cámara</span></button>' +",
            "          '<label class=\"btn-data\" style=\"margin:0; padding:14px; flex:1; cursor:pointer; border:1.5px dashed var(--primary);\"><input type=\"file\" accept=\"image/*\" style=\"display:none;\" onchange=\"Shopping.createCompletedListFromReceipt(this);\"><span style=\"font-size:22px;\">🖼️</span><span>Galería</span></label>' +",
            "        '</div>' +",
            "        '<button class=\"btn-danger-outline\" style=\"margin:0; padding:10px;\" onclick=\"document.getElementById(\\x27ticket-source-modal\\x27)?.remove()\">Cancelar</button>' +",
            "      '</div>';",
            "      ov.onclick = () => ov.remove();",
            "      document.body.appendChild(ov);",
            "    };",
            "",
            "    const topBar = document.querySelector('#view-lists .top-bar > div');",
            "    if (topBar && !document.getElementById('lists-scan-ticket-btn')) {",
            "      const btn = document.createElement('button'); btn.id = 'lists-scan-ticket-btn'; btn.className = 'icon-btn';",
            "      btn.style.cssText = 'width:auto; padding:0 8px; font-size:11px; font-weight:800; gap:3px; cursor:pointer;';",
            "      btn.innerHTML = '<span>📸</span><span>Ticket</span>';",
            "      btn.onclick = () => Shopping.openTicketSourceModal();",
            "      topBar.insertBefore(btn, topBar.firstChild);",
            "    }",
            "",
            "    Shopping.createCompletedListFromReceipt = async function(input) {",
            "      const file = input?.files?.[0]; if (!file) return;",
            "      if (typeof GroqAI === 'undefined' || !GroqAI.getApiKey()) return;",
            "      input.value = ''; document.getElementById('ticket-source-modal')?.remove(); UI.showSnackbar('⏳ Leyendo todos los productos y precios del ticket...');",
            "      try {",
            "        const parsed = await this.extractFullReceiptWithAI(file);",
            "        this.createList(true);",
            "        const list = Data.store.lists.find(l => l.id === Data.store.currentId) || Data.store.lists[0];",
            "        if (parsed.storeName) list.name = parsed.storeName.slice(0, 40);",
            "        list.items = parsed.items;",
            "        Data.save(); this.openShoppingView();",
            "        setTimeout(() => {",
            "          this.finishList();",
            "          if (parsed.receiptTotal > 0) { const manual = document.getElementById('finish-manual-total'); if (manual) { manual.value = parsed.receiptTotal.toFixed(2); this.updateFinishTotal(); } }",
            "          UI.showSnackbar('✨ Lista creada con ' + parsed.items.length + ' productos lista para guardar');",
            "        }, 250);",
            "      } catch(err) { UI.showSnackbar('Error leyendo el recibo'); }",
            "    };",
            "",
            "    // Sustituir tambien una lista YA COMPLETADA en el Historial tirando foto al ticket",
            "    if (!Shopping._origOpenHistDetail) Shopping._origOpenHistDetail = Shopping.openHistoryDetail.bind(Shopping);",
            "    Shopping.openHistoryDetail = function(listId) {",
            "      Shopping._origOpenHistDetail(listId);",
            "      const detailBox = document.getElementById('detail-items-list');",
            "      if (detailBox && !document.getElementById('hist-replace-receipt-bar')) {",
            "        const bar = document.createElement('div'); bar.id = 'hist-replace-receipt-bar'; bar.style.cssText = 'display:flex; gap:8px; margin-bottom:12px;';",
            "        bar.innerHTML = '<button type=\"button\" class=\"btn-data\" style=\"margin:0; padding:10px; flex:1; border-style:dashed; border-color:var(--primary); font-size:12px;\" onclick=\"SmartyCamera.take(\\x27list-history\\x27)\">📷 Ticket Cámara</button>' +",
            "          '<label class=\"btn-data\" style=\"margin:0; padding:10px; flex:1; cursor:pointer; border-style:dashed; border-color:var(--primary); font-size:12px;\"><input type=\"file\" accept=\"image/*\" style=\"display:none;\" onchange=\"Shopping.replaceCompletedListWithPhoto(this)\"><span>🖼️ Ticket Galería</span></label>';",
            "        detailBox.parentNode.insertBefore(bar, detailBox);",
            "      }",
            "    };",
            "",
            "    Shopping.replaceCompletedListWithPhoto = async function(input) {",
            "      const file = input?.files?.[0]; if (!file || !this.currentDetailListId) return;",
            "      if (typeof GroqAI === 'undefined' || !GroqAI.getApiKey()) return;",
            "      input.value = ''; UI.showSnackbar('⏳ Sustituyendo lista por los productos del ticket...');",
            "      try {",
            "        const parsed = await this.extractFullReceiptWithAI(file);",
            "        const list = Data.store.lists.find(l => l.id === this.currentDetailListId); if (!list) return;",
            "        list.items = parsed.items;",
            "        const calcTotal = parsed.items.reduce((sum, i) => sum + (parseFloat(i.price) || 0) * this.parseQtyValue(i.qty), 0);",
            "        list.total = parsed.receiptTotal > 0 ? parsed.receiptTotal : calcTotal;",
            "        Data.save();",
            "        this.openHistoryDetail(this.currentDetailListId);",
            "        UI.renderBudgetChart(); if (typeof Finance !== 'undefined') Finance.renderHomeWidgets();",
            "        UI.showSnackbar('✅ Lista sustituida por ' + parsed.items.length + ' productos del ticket');",
            "      } catch(e) { UI.showSnackbar('No se pudo leer el ticket'); }",
            "    };",
            "  }",
            "",
            "  window.getSmartBrandBadge = function(name) {",
            "    const n = String(name || '').toLowerCase().trim();",
            "    const brands = [",
            "      { m: ['netflix'], svg: '<svg viewBox=\"0 0 48 48\"><rect width=\"48\" height=\"48\" rx=\"10\" fill=\"#000\"/><path fill=\"#E50914\" d=\"M14 8h6l8 21V8h6v32h-6l-8-21v21h-6V8z\"/></svg>' },",
            "      { m: ['chatgpt', 'openai', 'gpt', 'claude'], svg: '<svg viewBox=\"0 0 48 48\"><rect width=\"48\" height=\"48\" rx=\"10\" fill=\"#10A37F\"/><path fill=\"none\" stroke=\"#FFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M24 12c4.5 0 8 3 8.5 7.2 3.8 1.5 5.5 5.8 3.8 9.6-1.2 2.8-3.8 4.6-6.8 4.8-1.8 3.2-5.8 4.4-9.2 2.8-1.5-.7-2.7-1.9-3.4-3.4-3.8-.5-6.6-3.8-6.4-7.6.1-2 .9-3.8 2.4-5.1-.5-4.2 2.5-8 6.7-8.5 1.5-.2 3 .1 4.4.8z\"/><circle cx=\"24\" cy=\"24\" r=\"3.5\" fill=\"#FFF\"/></svg>' },",
            "      { m: ['spotify'], svg: '<svg viewBox=\"0 0 48 48\"><rect width=\"48\" height=\"48\" rx=\"10\" fill=\"#1DB954\"/><path fill=\"none\" stroke=\"#000\" stroke-width=\"3.4\" stroke-linecap=\"round\" d=\"M13 19c7-2 15-1.5 22 2M15 25.5c5.5-1.5 12-1 17.5 1.8M17 31.5c4-1 9-.8 13 1.2\"/></svg>' },",
            "      { m: ['youtube', 'yt'], svg: '<svg viewBox=\"0 0 48 48\"><rect width=\"48\" height=\"48\" rx=\"10\" fill=\"#FF0000\"/><polygon points=\"20,16 33,24 20,32\" fill=\"#FFF\"/></svg>' },",
            "      { m: ['disney'], d: 'disneyplus.com' }, { m: ['prime', 'amazon'], d: 'primevideo.com' }, { m: ['max', 'hbo'], d: 'max.com' },",
            "      { m: ['apple', 'icloud'], d: 'apple.com' }, { m: ['google', 'drive'], d: 'one.google.com' }, { m: ['uber', '99'], d: 'uber.com' },",
            "      { m: ['ifood', 'rappi'], d: 'ifood.com.br' }, { m: ['nubank', 'nu '], d: 'nubank.com.br' }, { m: ['mercado pago', 'mercadopago'], d: 'mercadopago.com.br' },",
            "      { m: ['inter'], d: 'inter.co' }, { m: ['itau', 'itaú'], d: 'itau.com.br' }, { m: ['bradesco'], d: 'bradesco.com.br' }, { m: ['santander'], d: 'santander.com.br' },",
            "      { m: ['claro'], d: 'claro.com.br' }, { m: ['vivo'], d: 'vivo.com.br' }, { m: ['tim'], d: 'tim.com.br' }, { m: ['smartfit', 'gym', 'gimnasio', 'academia'], d: 'smartfit.com.br' }",
            "    ];",
            "    for (const b of brands) {",
            "      if (b.m.some(k => n.includes(k))) return b.svg ? '<span class=\"brand-logo-real\">' + b.svg + '</span>' : '<span class=\"brand-logo-real\" style=\"background:#fff;\"><img src=\"https://www.google.com/s2/favicons?domain=' + b.d + '&sz=128\" alt=\"\"></span>';",
            "    }",
            "    if (/(luz|energia|electricidad|enel|cemig)/.test(n)) return '<span class=\"brand-logo-real\" style=\"background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;font-size:19px;\">⚡</span>';",
            "    if (/(agua|saneamiento|sabesp)/.test(n)) return '<span class=\"brand-logo-real\" style=\"background:linear-gradient(135deg,#0EA5E9,#0284C7);color:#fff;font-size:19px;\">💧</span>';",
            "    if (/(internet|wifi|fibra)/.test(n)) return '<span class=\"brand-logo-real\" style=\"background:linear-gradient(135deg,#3B82F6,#1D4ED8);color:#fff;font-size:19px;\">🌐</span>';",
            "    if (/(alquiler|aluguel|renta|casa|condominio)/.test(n)) return '<span class=\"brand-logo-real\" style=\"background:linear-gradient(135deg,#10B981,#047857);color:#fff;font-size:19px;\">🏠</span>';",
            "    return '<span class=\"brand-logo-real\" style=\"background:var(--primary-grad);color:#fff;font-size:18px;\">💳</span>';",
            "  };",
            "",
            "  function setupNewCategoriesAndLabels() {",
            "    if (typeof UI === 'undefined') return;",
            "    ['es', 'pt', 'en'].forEach(l => {",
            "      if (!UI.dictionary?.[l]) return;",
            "      UI.dictionary[l].cat_leisure = l === 'en' ? 'Micro-expenses' : 'Microgastos';",
            "      UI.dictionary[l].cat_lunch = l === 'pt' ? 'Almoço' : (l === 'en' ? 'Lunch' : 'Almuerzo');",
            "      UI.dictionary[l].cat_dining = l === 'pt' ? 'Delivery e Saídas' : (l === 'en' ? 'Delivery & Dining' : 'Delivery y Salidas');",
            "      UI.dictionary[l].tab_subs = l === 'pt' ? 'Gastos Fixos' : (l === 'en' ? 'Fixed Exp.' : 'Gastos Fijos');",
            "      UI.dictionary[l].btn_add_sub = l === 'pt' ? '+ Novo Gasto Fixo' : (l === 'en' ? '+ New Fixed Expense' : '+ Nuevo Gasto Fijo');",
            "      UI.dictionary[l].mod_sub_title = l === 'pt' ? 'Novo Gasto Fixo' : (l === 'en' ? 'New Fixed Expense' : 'Nuevo Gasto Fijo');",
            "      UI.dictionary[l].empty_subs = l === 'pt' ? 'Sem gastos fixos ativos.' : (l === 'en' ? 'No active fixed expenses.' : 'Sin gastos fijos activos.');",
            "    });",
            "    if (Array.isArray(UI.categories) && !UI.categories.some(c => c.id === 'cat_lunch')) {",
            "      const idx = UI.categories.findIndex(c => c.id === 'cat_leisure');",
            "      const add = [{ id: 'cat_lunch', icon: 'lunch' }, { id: 'cat_dining', icon: 'dining' }];",
            "      if (idx >= 0) UI.categories.splice(idx, 0, ...add); else UI.categories.push(...add);",
