name: Build Smarty Android APK
on:
  push:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets, Compress Images & Inject APK Addons
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick pngquant
          rm -rf www android package.json package-lock.json capacitor.config.json node_modules
          mkdir -p www

          cp index.html style.css manifest.json logo.png www/ 2>/dev/null || true
          cp data.js ui.js assistant.js finance.js shopping.js main.js www/ 2>/dev/null || true
          cp idle.png happy.png worried.png alert.png thinking.png listening.png broke.png www/ 2>/dev/null || true
          if [ -d "skins" ]; then cp -r skins www/; fi

          find www -type f -name "*.png" -exec mogrify -strip -resize "360x360>" {} +
          find www -type f -name "*.png" -exec pngquant --force --ext .png --quality=65-80 {} + || true

          cat << 'EOF_SCRIPT' > inject_apk.js
          const fs = require("fs");

          if (fs.existsSync("www/assistant.js")) {
            let ast = fs.readFileSync("www/assistant.js", "utf8");
            ast = ast.replace("maxTokens = 650", "maxTokens = 2500");
            fs.writeFileSync("www/assistant.js", ast);
          }

          const addons = [
            "(function() {",
            "  const st = document.createElement('style');",
            "  st.innerHTML = '#listening-overlay:not(.active), .modal-overlay:not(.open), #custom-confirm:not(.open) { display: none !important; pointer-events: none !important; } .pin-pad .pin-btn.bio-btn-active { visibility: visible !important; pointer-events: auto !important; color: var(--primary) !important; font-size: 24px !important; }';",
            "  document.head.appendChild(st);",
            "",
            "  function stemProduct(name) {",
            "    let s = String(name || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').trim();",
            "    s = s.replace(/[^a-z0-9\\s]/g, '').replace(/\\s+/g, ' ');",
            "    return s.split(' ').map(w => (w.length > 4 && w.endsWith('es')) ? w.slice(0,-2) : ((w.length > 3 && w.endsWith('s')) ? w.slice(0,-1) : w)).join(' ') || 'item';",
            "  }",
            "",
            "  function upgradeSmartyFullDataAccess() {",
            "    if (typeof Assistant === 'undefined') return;",
            "    Assistant.buildCompleteShoppingIndex = function() {",
            "      const groups = {};",
            "      (Data.store.lists || []).filter(l => l.status === 'completed').forEach(list => {",
            "        const dStr = new Date(list.date).toLocaleDateString();",
            "        (list.items || []).filter(i => i.checked !== false).forEach(item => {",
            "          const raw = String(item.name || '').trim();",
            "          if (!raw) return;",
            "          const k = stemProduct(raw);",
            "          const q = (typeof Shopping !== 'undefined' && Shopping.parseQtyValue) ? Shopping.parseQtyValue(item.qty) : (parseFloat(item.qty) || 1);",
            "          const p = parseFloat(item.price) || 0;",
            "          if (!groups[k]) groups[k] = { name: raw, vars: new Set(), count: 0, units: 0, spent: 0, prices: [] };",
            "          groups[k].vars.add(raw);",
            "          groups[k].count += 1;",
            "          groups[k].units += q;",
            "          groups[k].spent += (p * q);",
            "          if (p > 0) groups[k].prices.push(dStr + ':' + p.toFixed(2));",
            "        });",
            "      });",
            "      const arr = Object.values(groups).sort((a,b) => b.count - a.count || b.units - a.units);",
            "      if (!arr.length) return 'Sin productos comprados en listas completadas.';",
            "      return arr.slice(0, 60).map(g => '- ' + g.name + ' (nombres: ' + Array.from(g.vars).join('/') + '): comprado ' + g.count + ' veces | unidades: ' + g.units + ' | gasto total: ' + g.spent.toFixed(2) + ' | historial precios: [' + g.prices.slice(-4).join(', ') + ']').join('\\n');",
            "    };",
            "    const origCtx = Assistant.getFinancialContext.bind(Assistant);",
            "    Assistant.getFinancialContext = function(q = '') {",
            "      const base = origCtx(q);",
            "      const idx = this.buildCompleteShoppingIndex();",
            "      const lists = (Data.store.lists || []).filter(l => l.status === 'completed').sort((a,b)=>b.date-a.date).slice(0,15).map(l => new Date(l.date).toLocaleDateString() + ' ' + l.name + ' (' + Number(l.total||0).toFixed(2) + '): ' + (l.items||[]).filter(i=>i.checked!==false).map(i=>i.name + (i.qty?' x'+i.qty:'')).join(', ')).join('\\n');",
            "      const exps = [...(Data.store.expenses || [])].sort((a,b)=>Number(b.date||0)-Number(a.date||0)).slice(0,40).map(e => new Date(e.date).toLocaleDateString() + ' | ' + e.desc + ' | ' + Number(e.amount||0).toFixed(2) + ' | ' + (e.category||'Otros')).join('\\n');",
            "      return base + '\\n\\nRANKING COMPLETO DE PRODUCTOS COMPRADOS EN SUPERMERCADO (AGRUPADOS):\\n' + idx + '\\n\\nDETALLE ULTIMAS 15 LISTAS DE COMPRAS:\\n' + lists + '\\n\\nULTIMOS 40 GASTOS INDIVIDUALES:\\n' + exps + '\\n\\nREGLA CLAVE: Tienes acceso total a todos los productos comprados en listas y gastos. Si un producto tiene variaciones de nombre, plurales o faltas de ortografia, asocialos como el mismo producto, suma sus cantidades y responde con exactitud.';",
            "    };",
            "  }",
            "",
            "  window.askGroqKeyModal = function() {",
            "    const old = document.getElementById('groq-key-modal'); if (old) old.remove();",
            "    const ov = document.createElement('div'); ov.id = 'groq-key-modal'; ov.className = 'modal-overlay open'; ov.style.zIndex = '25000';",
            "    const curr = (Data?.store?.settings?.groqApiKey || '').trim();",
            "    ov.innerHTML = '<div class=\"settings-card\" onclick=\"event.stopPropagation()\" style=\"max-width:350px;\"><h3 style=\"margin:0 0 8px 0; color:var(--primary);\">Clave API de Groq (Smarty AI)</h3><p style=\"font-size:12px; color:var(--text-sec); margin:0 0 12px 0;\">Pega tu clave gratuita de Groq (gsk_...)</p><input type=\"text\" id=\"groq-key-input-field\" class=\"setting-input\" placeholder=\"gsk_...\" value=\"' + curr + '\" style=\"width:100%; margin-bottom:12px;\"><div style=\"display:flex; gap:8px;\"><button class=\"btn-danger-outline\" style=\"margin:0; flex:1; padding:12px;\" id=\"gk-cancel\">Cerrar</button><button class=\"btn-full\" style=\"margin:0; flex:1; padding:12px;\" id=\"gk-save\">Guardar</button></div></div>';",
            "    document.body.appendChild(ov);",
            "    ov.querySelector('#gk-cancel').onclick = () => ov.remove();",
            "    ov.querySelector('#gk-save').onclick = () => {",
            "      const val = ov.querySelector('#groq-key-input-field').value.trim();",
            "      if (!Data.store.settings) Data.store.settings = {};",
            "      Data.store.settings.groqApiKey = val; Data.save();",
            "      if (typeof GroqAI !== 'undefined') GroqAI.refreshUsagePanel();",
            "      if (typeof UI !== 'undefined') { UI.showSnackbar(val ? 'Smarty AI activado' : 'Clave borrada'); UI.renderSettingsView(); }",
            "      ov.remove();",
            "    };",
            "  };",
            "",
            "  if (typeof GroqAI !== 'undefined') {",
            "    GroqAI.getApiKey = function() {",
            "      if (!Data.store.settings) Data.store.settings = {};",
            "      const s = (Data.store.settings.groqApiKey || '').trim();",
            "      if (s) return s; window.askGroqKeyModal(); return null;",
            "    };",
            "  }",
            "",
            "  if (typeof Main !== 'undefined') {",
            "    const origBkp = Main.downloadBackup.bind(Main);",
            "    Main.downloadBackup = function() {",
            "      if (window.SmartyAndroid && window.SmartyAndroid.saveBackupFile) {",
            "        window.SmartyAndroid.saveBackupFile(Data.exportJSON(), 'smart_life_backup_' + new Date().toISOString().slice(0,10) + '.json');",
            "        return;",
            "      }",
            "      origBkp();",
            "    };",
            "  }",
            "",
            "  window._onAndroidBackupFileRestored = async function(jsonStr) {",
            "    if (Data.importJSON(jsonStr)) { await UI.confirm('import_success_title', 'import_success_msg'); location.reload(); }",
            "    else UI.showSnackbar('Error: Archivo invalido');",
            "  };",
            "",
            "  window.NativeBridge = {",
            "    lastCapturedText: 'Ninguna todavia',",
            "    init() {",
            "      if (!Data.store.settings) Data.store.settings = {};",
            "      if (typeof Data.store.settings.bankAutoDetect === 'undefined') Data.store.settings.bankAutoDetect = true;",
            "      if (typeof Data.store.settings.bankAutoSaveMode === 'undefined') Data.store.settings.bankAutoSaveMode = 'confirm';",
            "      window.addEventListener('SmartyBankNotification', (e) => { if (e && e.detail) this.processBankNotification(e.detail); });",
            "      this.flushPending();",
            "      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { this.flushPending(); if (typeof UI !== 'undefined' && document.getElementById('android-pro-settings')) UI.renderSettingsView(); } });",
            "    },",
            "    isListenerPermissionGranted() {",
            "      try { return !!(window.SmartyAndroid && window.SmartyAndroid.isNotificationListenerEnabled()); } catch(_) { return false; }",
            "    },",
            "    flushPending() {",
            "      try {",
            "        if (window.SmartyAndroid && window.SmartyAndroid.getPendingNotificationsJson) {",
            "          const raw = window.SmartyAndroid.getPendingNotificationsJson();",
            "          if (raw && raw !== '[]') JSON.parse(raw).forEach(i => this.processBankNotification(i));",
            "        }",
            "      } catch(_) {}",
            "    },",
            "    toggleBiometricSetting(checked) {",
            "      if (checked && !Data.store.settings.pin) { UI.showSnackbar('Primero crea un PIN de respaldo'); Main.togglePinLock(); }",
            "      Data.store.settings.biometricEnabled = checked; Data.save();",
            "      if (checked && window.SmartyAndroid?.authenticateBiometric) window.SmartyAndroid.authenticateBiometric();",
            "    },",
            "    openNotificationAccessSettings() { if (window.SmartyAndroid?.openNotificationSettings) window.SmartyAndroid.openNotificationSettings(); },",
            "    async processBankNotification(notif) {",
            "      const fullText = ((notif.title || '') + ' - ' + (notif.text || '')).trim();",
            "      if (fullText.length < 4) return;",
            "      this.lastCapturedText = fullText.slice(0, 70);",
            "      localStorage.setItem('smarty_last_notif', this.lastCapturedText);",
            "      const logEl = document.getElementById('smarty-last-notif-log'); if (logEl) logEl.innerText = this.lastCapturedText;",
            "      if (!Data.store.settings?.bankAutoDetect) return;",
            "      const payRegex = /(compra|pago|pagaste|aprobada|aprovada|pix|transferencia|debito|credito|spent|paid|r\\$|\\$)/i;",
            "      if (!payRegex.test(fullText)) return;",
            "      const m = fullText.match(/(\\d+(?:[.,]\\d{1,2})?)/);",
            "      if (!m) return;",
            "      const amount = parseFloat(m[1].replace(',', '.'));",
            "      if (!amount || amount <= 0) return;",
            "      const desc = 'Banco: ' + (notif.title || 'Pago');",
            "      if (Data.store.settings.bankAutoSaveMode === 'auto') {",
            "        Data.store.expenses.push({ id: Date.now().toString(), date: Date.now(), amount, desc, category: UI.t('cat_other'), isInstallment: false });",
            "        Data.save(); UI.renderBudgetChart(); Finance.renderHomeWidgets();",
            "        if (typeof Assistant !== 'undefined') Assistant.showReactivePopup('Auto-registrado: ' + UI.formatMoney(amount));",
            "      } else {",
            "        Finance.openSmartExpenseModal(amount, desc, 'cat_other');",
            "      }",
            "    },",
            "    sendRealTestNotificationToStatusBar() {",
            "      Data.store.settings.bankAutoDetect = true; Data.save();",
            "      if (!this.isListenerPermissionGranted()) { UI.showSnackbar('Primero activa el Permiso de Notificaciones'); this.openNotificationAccessSettings(); return; }",
            "      if (window.SmartyAndroid?.postRealTestNotification) {",
            "        UI.showSnackbar('Lanzando notificacion real a tu barra de Android...');",
            "        window.SmartyAndroid.postRealTestNotification('Nubank', 'Compra aprobada en Cafeteria Central por $18.50');",
            "      }",
            "    }",
            "  };",
            "",
            "  function setupBioBtn() {",
            "    const b = document.querySelector('.pin-pad .pin-btn:nth-child(10)');",
            "    if (b && !b.classList.contains('bio-btn-active')) {",
            "      b.classList.add('bio-btn-active'); b.innerHTML = 'HUELLA'; b.style.fontSize = '11px';",
            "      b.onclick = () => { if (window.SmartyAndroid?.authenticateBiometric) window.SmartyAndroid.authenticateBiometric(); };",
            "    }",
            "    if ((Data?.store?.settings?.pin || Data?.store?.settings?.biometricEnabled) && window.SmartyAndroid?.authenticateBiometric) {",
            "      setTimeout(() => window.SmartyAndroid.authenticateBiometric(), 400);",
            "    }",
            "  }",
            "",
            "  function hookSettings() {",
            "    if (typeof UI === 'undefined' || !UI.renderSettingsView) return;",
            "    const orig = UI.renderSettingsView.bind(UI);",
            "    UI.renderSettingsView = function() {",
            "      orig();",
            "      const rInp = document.getElementById('restore-input');",
            "      if (rInp && window.SmartyAndroid?.pickRestoreFile) { rInp.onclick = (e) => { e.preventDefault(); window.SmartyAndroid.pickRestoreFile(); }; }",
            "      const c = document.getElementById('settings-inject'); if (!c) return;",
            "      const old = document.getElementById('android-pro-settings'); if (old) old.remove();",
            "      const s = Data.store.settings || {};",
            "      const hasK = !!(s.groqApiKey && s.groqApiKey.trim());",
            "      const perm = NativeBridge.isListenerPermissionGranted();",
            "      const lastN = localStorage.getItem('smarty_last_notif') || NativeBridge.lastCapturedText;",
            "      const p = document.createElement('div'); p.id = 'android-pro-settings'; p.style.marginBottom = '20px';",
            "      p.innerHTML = '<div class=\"section-label\">OPCIONES ANDROID & SMARTY AI</div><div class=\"glass-card\" style=\"padding:15px; margin:0;\">' +",
            "        '<div class=\"setting-item\"><span>API Key de Groq (Smarty AI)</span><button class=\"text-btn-small\" style=\"background:var(--input-bg);\" onclick=\"window.askGroqKeyModal()\">' + (hasK ? 'Configurada OK' : 'Poner Clave +') + '</button></div>' +",
            "        '<div class=\"setting-item\"><span>Desbloqueo con Huella / Rostro</span><label class=\"switch-wrap\"><input type=\"checkbox\" ' + (s.biometricEnabled ? 'checked' : '') + ' onchange=\"NativeBridge.toggleBiometricSetting(this.checked)\"><span class=\"slider\"></span></label></div>' +",
            "        '<div class=\"setting-item\"><span>Leer Notificaciones de Bancos</span><label class=\"switch-wrap\"><input type=\"checkbox\" ' + (s.bankAutoDetect ? 'checked' : '') + ' onchange=\"Data.store.settings.bankAutoDetect = this.checked; Data.save(); if(this.checked && !NativeBridge.isListenerPermissionGranted()) NativeBridge.openNotificationAccessSettings();\"><span class=\"slider\"></span></label></div>' +",
            "        '<div class=\"setting-item\"><span>Modo Registro Bancario</span><select class=\"setting-select\" style=\"width:auto; margin:0; padding:6px 10px; font-size:12px;\" onchange=\"Data.store.settings.bankAutoSaveMode = this.value; Data.save();\"><option value=\"confirm\" ' + (s.bankAutoSaveMode !== 'auto' ? 'selected' : '') + '>Confirmar antes</option><option value=\"auto\" ' + (s.bankAutoSaveMode === 'auto' ? 'selected' : '') + '>Guardar 100% solo</option></select></div>' +",
            "        '<div style=\"background:var(--input-bg); border-radius:12px; padding:10px; margin-top:10px; font-size:11px;\"><div style=\"display:flex; justify-content:space-between; margin-bottom:4px;\"><b>Estado Lector Android:</b><b style=\"color:' + (perm ? 'var(--success)' : 'var(--danger)') + ';\">' + (perm ? 'CONECTADO' : 'FALTA PERMISO') + '</b></div><div style=\"color:var(--text-sec); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\"><b>Ultima leida:</b> <span id=\"smarty-last-notif-log\">' + lastN + '</span></div></div>' +",
            "        '<div style=\"display:flex; gap:8px; margin-top:10px;\"><button class=\"btn-data\" style=\"padding:10px; font-size:12px;\" onclick=\"NativeBridge.openNotificationAccessSettings()\">Permiso Android</button><button class=\"btn-data\" style=\"padding:10px; font-size:12px;\" onclick=\"NativeBridge.sendRealTestNotificationToStatusBar()\">Probar Notif. Real</button></div></div>';",
            "      c.insertBefore(p, c.firstChild);",
            "    };",
            "  }",
            "",
            "  window.addEventListener('load', () => {",
            "    upgradeSmartyFullDataAccess();",
            "    hookSettings();",
            "    setTimeout(() => { NativeBridge.init(); setupBioBtn(); if (typeof UI !== 'undefined') UI.renderSettingsView(); }, 400);",
            "  });",
            "})();"
          ].join("\n");

          fs.writeFileSync("www/smarty-pro-addons.js", addons);

          if (fs.existsSync("www/index.html")) {
            let html = fs.readFileSync("www/index.html", "utf8");
            html = html.replace(/serviceWorker/g, "serviceWorkerDisabledInAPK");
            html = html.replace('main.js"></script>', 'main.js"></script><script src="smarty-pro-addons.js"></script>');
            fs.writeFileSync("www/index.html", html);
          }

          fs.writeFileSync("capacitor.config.json", JSON.stringify({
            appId: "com.smartlife.pro",
            appName: "Smart Life Pro",
            webDir: "www"
          }, null, 2));
          EOF_SCRIPT

          node inject_apk.js
          rm -f inject_apk.js

          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2 @capacitor/local-notifications@6.1.0 @capacitor/preferences@6.0.2
          npx cap add android
          npx cap sync android

      - name: Set App Icon, Immersive Fullscreen Mode & Inject Native Java
        run: |
          if [ -f "www/logo.png" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in android/app/src/main/res/mipmap-*; do
              if [ -d "$d" ]; then
                convert www/logo.png -resize 192x192 "$d/ic_launcher.png"
                convert www/logo.png -resize 192x192 "$d/ic_launcher_round.png"
                convert www/logo.png -resize 192x192 "$d/ic_launcher_foreground.png"
              fi
            done
          fi

          cat << 'EOF_JAVA' > setup_java.js
          const fs = require("fs");
          const pkgDir = "android/app/src/main/java/com/smartlife/pro";
          fs.mkdirSync(pkgDir, { recursive: true });

          let buildGradle = fs.readFileSync("android/app/build.gradle", "utf8");
          buildGradle = buildGradle.replace("defaultConfig {", "defaultConfig {\n        ndk {\n            abiFilters 'arm64-v8a', 'armeabi-v7a'\n        }");
          fs.writeFileSync("android/app/build.gradle", buildGradle);

          const notifService = [
            "package com.smartlife.pro;",
            "import android.app.Notification;",
            "import android.content.SharedPreferences;",
            "import android.os.Bundle;",
            "import android.service.notification.NotificationListenerService;",
            "import android.service.notification.StatusBarNotification;",
            "import android.content.Intent;",
            "import org.json.JSONArray;",
            "import org.json.JSONObject;",
            "public class SmartyNotificationService extends NotificationListenerService {",
            "    @Override",
            "    public void onNotificationPosted(StatusBarNotification sbn) {",
            "        if (sbn == null) return;",
            "        String pkg = sbn.getPackageName();",
            "        if (pkg == null) return;",
            "        if (sbn.getNotification() == null || sbn.getNotification().extras == null) return;",
            "        Bundle extras = sbn.getNotification().extras;",
            "        CharSequence titleCs = extras.getCharSequence(Notification.EXTRA_TITLE);",
            "        CharSequence textCs = extras.getCharSequence(Notification.EXTRA_TEXT);",
            "        String title = titleCs != null ? titleCs.toString() : \"\";",
            "        String text = textCs != null ? textCs.toString() : \"\";",
            "        if (title.isEmpty() && text.isEmpty()) return;",
            "        if (pkg.equals(\"com.smartlife.pro\") && !title.equals(\"Nubank\")) return;",
            "        try {",
            "            SharedPreferences prefs = getSharedPreferences(\"smarty_bank_queue\", MODE_PRIVATE);",
            "            String raw = prefs.getString(\"queue\", \"[]\");",
            "            JSONArray arr = new JSONArray(raw);",
            "            JSONObject item = new JSONObject();",
            "            item.put(\"package\", pkg);",
            "            item.put(\"title\", title);",
            "            item.put(\"text\", text);",
            "            arr.put(item);",
            "            prefs.edit().putString(\"queue\", arr.toString()).apply();",
            "        } catch (Exception ignored) {}",
            "        Intent intent = new Intent(\"SMARTY_BANK_NOTIFICATION\");",
            "        intent.setPackage(getPackageName());",
            "        intent.putExtra(\"package\", pkg);",
            "        intent.putExtra(\"title\", title);",
            "        intent.putExtra(\"text\", text);",
            "        sendBroadcast(intent);",
            "    }",
            "}"
          ].join("\n");

          const mainActivity = [
            "package com.smartlife.pro;",
            "import android.Manifest;",
            "import android.app.Activity;",
            "import android.app.NotificationChannel;",
            "import android.app.NotificationManager;",
            "import android.content.BroadcastReceiver;",
            "import android.content.Context;",
            "import android.content.DialogInterface;",
            "import android.content.Intent;",
            "import android.content.IntentFilter;",
            "import android.content.SharedPreferences;",
            "import android.content.pm.PackageManager;",
            "import android.hardware.biometrics.BiometricPrompt;",
            "import android.net.Uri;",
            "import android.os.Build;",
            "import android.os.Bundle;",
            "import android.os.CancellationSignal;",
            "import android.provider.Settings;",
            "import android.util.Base64;",
            "import android.view.View;",
            "import android.view.WindowInsets;",
            "import android.view.WindowInsetsController;",
            "import android.webkit.JavascriptInterface;",
            "import androidx.core.app.ActivityCompat;",
            "import androidx.core.app.NotificationCompat;",
            "import androidx.core.content.ContextCompat;",
            "import com.getcapacitor.BridgeActivity;",
            "import java.io.BufferedReader;",
            "import java.io.InputStream;",
            "import java.io.InputStreamReader;",
            "import java.io.OutputStream;",
            "import java.nio.charset.StandardCharsets;",
            "import org.json.JSONObject;",
            "public class MainActivity extends BridgeActivity {",
            "    private BroadcastReceiver bankReceiver;",
            "    private static final int PICK_RESTORE_JSON = 9901;",
            "    private static final int CREATE_BACKUP_JSON = 9902;",
            "    private String pendingBackupContent = \"\";",
            "    private void enableImmersiveNavigation() {",
            "        try {",
            "            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {",
            "                final WindowInsetsController controller = getWindow().getInsetsController();",
            "                if (controller != null) {",
            "                    controller.hide(WindowInsets.Type.navigationBars());",
            "                    controller.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);",
            "                }",
            "            } else {",
            "                getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);",
            "            }",
            "        } catch (Exception ignored) {}",
            "    }",
            "    @Override",
            "    public void onWindowFocusChanged(boolean hasFocus) {",
            "        super.onWindowFocusChanged(hasFocus);",
            "        if (hasFocus) enableImmersiveNavigation();",
            "    }",
            "    public class SmartyJSBridge {",
            "        @JavascriptInterface",
            "        public void openNotificationSettings() {",
            "            Intent intent = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);",
            "            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);",
            "            startActivity(intent);",
            "        }",
            "        @JavascriptInterface",
            "        public boolean isNotificationListenerEnabled() {",
            "            String flat = Settings.Secure.getString(getContentResolver(), \"enabled_notification_listeners\");",
            "            return flat != null && flat.contains(getPackageName());",
            "        }",
            "        @JavascriptInterface",
            "        public String getPendingNotificationsJson() {",
            "            SharedPreferences prefs = getSharedPreferences(\"smarty_bank_queue\", MODE_PRIVATE);",
            "            String q = prefs.getString(\"queue\", \"[]\");",
            "            prefs.edit().putString(\"queue\", \"[]\").apply();",
            "            return q;",
            "        }",
            "        @JavascriptInterface",
            "        public void postRealTestNotification(String title, String body) {",
            "            try {",
            "                NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);",
            "                String chId = \"smarty_test_bank\";",
            "                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {",
            "                    NotificationChannel ch = new NotificationChannel(chId, \"Prueba Bancaria\", NotificationManager.IMPORTANCE_HIGH);",
            "                    nm.createNotificationChannel(ch);",
            "                }",
            "                NotificationCompat.Builder b = new NotificationCompat.Builder(MainActivity.this, chId)",
            "                    .setSmallIcon(android.R.drawable.ic_dialog_info)",
            "                    .setContentTitle(title)",
            "                    .setContentText(body)",
            "                    .setPriority(NotificationCompat.PRIORITY_HIGH)",
            "                    .setAutoCancel(true);",
            "                nm.notify(7788, b.build());",
            "            } catch (Exception ignored) {}",
            "        }",
            "        @JavascriptInterface",
            "        public void pickRestoreFile() {",
            "            Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);",
            "            intent.addCategory(Intent.CATEGORY_OPENABLE);",
            "            intent.setType(\"*/*\");",
            "            startActivityForResult(intent, PICK_RESTORE_JSON);",
            "        }",
            "        @JavascriptInterface",
            "        public void saveBackupFile(String jsonContent, String fileName) {",
            "            pendingBackupContent = jsonContent;",
            "            Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);",
            "            intent.addCategory(Intent.CATEGORY_OPENABLE);",
            "            intent.setType(\"application/json\");",
            "            intent.putExtra(Intent.EXTRA_TITLE, fileName);",
            "            startActivityForResult(intent, CREATE_BACKUP_JSON);",
            "        }",
            "        @JavascriptInterface",
            "        public void authenticateBiometric() {",
            "            runOnUiThread(new Runnable() {",
            "                @Override",
            "                public void run() {",
            "                    try {",
            "                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {",
            "                            BiometricPrompt prompt = new BiometricPrompt.Builder(MainActivity.this)",
            "                                .setTitle(\"Desbloquear Smart Life Pro\")",
            "                                .setSubtitle(\"Usa tu huella o rostro para entrar\")",
            "                                .setNegativeButton(\"Usar PIN\", getMainExecutor(), new DialogInterface.OnClickListener() {",
            "                                    @Override",
            "                                    public void onClick(DialogInterface dialog, int which) {}",
            "                                })",
            "                                .build();",
            "                            prompt.authenticate(new CancellationSignal(), getMainExecutor(), new BiometricPrompt.AuthenticationCallback() {",
            "                                @Override",
            "                                public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {",
            "                                    getBridge().getWebView().post(new Runnable() {",
            "                                        @Override",
            "                                        public void run() {",
            "                                            getBridge().getWebView().evaluateJavascript(\"if(window.Main) Main.unlockApp();\", null);",
            "                                        }",
            "                                    });",
            "                                }",
            "                            });",
            "                        }",
            "                    } catch (Exception ignored) {}",
            "                }",
            "            });",
            "        }",
            "    }",
            "    @Override",
            "    protected void onActivityResult(int requestCode, int resultCode, Intent data) {",
            "        super.onActivityResult(requestCode, resultCode, data);",
            "        if (requestCode == PICK_RESTORE_JSON && resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {",
            "            try {",
            "                Uri uri = data.getData();",
            "                InputStream is = getContentResolver().openInputStream(uri);",
            "                BufferedReader reader = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));",
            "                StringBuilder sb = new StringBuilder();",
            "                String line;",
            "                while ((line = reader.readLine()) != null) sb.append(line).append(\"\\n\");",
            "                reader.close();",
            "                String b64 = Base64.encodeToString(sb.toString().getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);",
            "                final String js = \"if(window._onAndroidBackupFileRestored) window._onAndroidBackupFileRestored(decodeURIComponent(escape(atob('\" + b64 + \"'))));\";",
            "                getBridge().getWebView().post(new Runnable() {",
            "                    @Override",
            "                    public void run() {",
            "                        getBridge().getWebView().evaluateJavascript(js, null);",
            "                    }",
            "                });",
            "            } catch (Exception ignored) {}",
            "        } else if (requestCode == CREATE_BACKUP_JSON && resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {",
            "            try {",
            "                Uri uri = data.getData();",
            "                OutputStream os = getContentResolver().openOutputStream(uri);",
            "                os.write(pendingBackupContent.getBytes(StandardCharsets.UTF_8));",
            "                os.close();",
            "                getBridge().getWebView().post(new Runnable() {",
            "                    @Override",
            "                    public void run() {",
            "                        getBridge().getWebView().evaluateJavascript(\"if(window.UI) UI.showSnackbar('Copia guardada correctamente');\", null);",
            "                    }",
            "                });",
            "            } catch (Exception ignored) {}",
            "        }",
            "    }",
            "    @Override",
            "    protected void onCreate(Bundle savedInstanceState) {",
            "        super.onCreate(savedInstanceState);",
            "        enableImmersiveNavigation();",
            "        if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {",
            "            ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA, Manifest.permission.POST_NOTIFICATIONS}, 101);",
            "        }",
            "        getBridge().getWebView().addJavascriptInterface(new SmartyJSBridge(), \"SmartyAndroid\");",
            "        bankReceiver = new BroadcastReceiver() {",
            "            @Override",
            "            public void onReceive(Context context, Intent intent) {",
            "                try {",
            "                    SharedPreferences prefs = getSharedPreferences(\"smarty_bank_queue\", MODE_PRIVATE);",
            "                    prefs.edit().putString(\"queue\", \"[]\").apply();",
            "                    JSONObject obj = new JSONObject();",
            "                    obj.put(\"package\", intent.getStringExtra(\"package\"));",
            "                    obj.put(\"title\", intent.getStringExtra(\"title\"));",
            "                    obj.put(\"text\", intent.getStringExtra(\"text\"));",
            "                    final String js = \"window.dispatchEvent(new CustomEvent('SmartyBankNotification', { detail: \" + obj.toString() + \" }));\";",
            "                    getBridge().getWebView().post(new Runnable() {",
            "                        @Override",
            "                        public void run() {",
            "                            getBridge().getWebView().evaluateJavascript(js, null);",
            "                        }",
            "                    });",
            "                } catch (Exception ignored) {}",
            "            }",
            "        };",
            "        IntentFilter filter = new IntentFilter(\"SMARTY_BANK_NOTIFICATION\");",
            "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {",
            "            registerReceiver(bankReceiver, filter, Context.RECEIVER_NOT_EXPORTED);",
            "        } else {",
            "            registerReceiver(bankReceiver, filter);",
            "        }",
            "    }",
            "    @Override",
            "    public void onDestroy() {",
            "        if (bankReceiver != null) unregisterReceiver(bankReceiver);",
            "        super.onDestroy();",
            "    }",
            "}"
          ].join("\n");

          fs.writeFileSync(pkgDir + "/SmartyNotificationService.java", notifService);
          fs.writeFileSync(pkgDir + "/MainActivity.java", mainActivity);

          let manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          if (!manifest.includes("USE_BIOMETRIC")) {
              manifest = manifest.replace("<application", "<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.USE_BIOMETRIC\" />\n    <uses-permission android:name=\"android.permission.USE_FINGERPRINT\" />\n    <application");
          }
          if (!manifest.includes("SmartyNotificationService")) {
              const serviceTag = "<service android:name=\".SmartyNotificationService\" android:label=\"Smarty Lector Bancario\" android:exported=\"true\" android:permission=\"android.permission.BIND_NOTIFICATION_LISTENER_SERVICE\"><intent-filter><action android:name=\"android.service.notification.NotificationListenerService\" /></intent-filter></service>\n    </application>";
              manifest = manifest.replace("</application>", serviceTag);
          }
          fs.writeFileSync("android/app/src/main/AndroidManifest.xml", manifest);
          EOF_JAVA

          node setup_java.js
          rm -f setup_java.js

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLifePro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
