name: Build Smarty Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Web Assets & Capacitor Android
        run: |
          mkdir -p www
          cp *.html *.css *.js *.json *.png www/ 2>/dev/null || true
          cp -r skins www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/preferences@6
          npx cap init "Smart Life Pro" "com.smartlife.pro" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Inject Native Biometrics (Fingerprint/Face) & Bank Notification Listener
        run: |
          PKG_DIR="android/app/src/main/java/com/smartlife/pro"
          mkdir -p "$PKG_DIR"

          # 1. Servicio Lector de Notificaciones Bancarias
          printf '%s\n' \
            'package com.smartlife.pro;' \
            'import android.app.Notification;' \
            'import android.os.Bundle;' \
            'import android.service.notification.NotificationListenerService;' \
            'import android.service.notification.StatusBarNotification;' \
            'import android.content.Intent;' \
            'public class SmartyNotificationService extends NotificationListenerService {' \
            '    @Override' \
            '    public void onNotificationPosted(StatusBarNotification sbn) {' \
            '        if (sbn == null) return;' \
            '        String pkg = sbn.getPackageName();' \
            '        if (pkg == null || pkg.equals("com.smartlife.pro")) return;' \
            '        if (sbn.getNotification() == null || sbn.getNotification().extras == null) return;' \
            '        Bundle extras = sbn.getNotification().extras;' \
            '        CharSequence titleCs = extras.getCharSequence(Notification.EXTRA_TITLE);' \
            '        CharSequence textCs = extras.getCharSequence(Notification.EXTRA_TEXT);' \
            '        String title = titleCs != null ? titleCs.toString() : "";' \
            '        String text = textCs != null ? textCs.toString() : "";' \
            '        if (title.isEmpty() && text.isEmpty()) return;' \
            '        Intent intent = new Intent("SMARTY_BANK_NOTIFICATION");' \
            '        intent.setPackage(getPackageName());' \
            '        intent.putExtra("package", pkg);' \
            '        intent.putExtra("title", title);' \
            '        intent.putExtra("text", text);' \
            '        sendBroadcast(intent);' \
            '    }' \
            '}' > "$PKG_DIR/SmartyNotificationService.java"

          # 2. MainActivity con Huella/Reconocimiento Facial Nativo + Puente de Notificaciones
          printf '%s\n' \
            'package com.smartlife.pro;' \
            'import android.app.KeyguardManager;' \
            'import android.content.BroadcastReceiver;' \
            'import android.content.Context;' \
            'import android.content.Intent;' \
            'import android.content.IntentFilter;' \
            'import android.hardware.biometrics.BiometricPrompt;' \
            'import android.os.Build;' \
            'import android.os.Bundle;' \
            'import android.os.CancellationSignal;' \
            'import android.provider.Settings;' \
            'import android.webkit.JavascriptInterface;' \
            'import com.getcapacitor.BridgeActivity;' \
            'import org.json.JSONObject;' \
            'public class MainActivity extends BridgeActivity {' \
            '    private BroadcastReceiver bankReceiver;' \
            '    @Override' \
            '    public void onCreate(Bundle savedInstanceState) {' \
            '        super.onCreate(savedInstanceState);' \
            '        getBridge().getWebView().addJavascriptInterface(new Object() {' \
            '            @JavascriptInterface' \
            '            public void openNotificationSettings() {' \
            '                Intent intent = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS);' \
            '                intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);' \
            '                startActivity(intent);' \
            '            }' \
            '            @JavascriptInterface' \
            '            public void authenticateBiometric() {' \
            '                runOnUiThread(() -> {' \
            '                    try {' \
            '                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {' \
            '                            BiometricPrompt prompt = new BiometricPrompt.Builder(MainActivity.this)' \
            '                                .setTitle("Desbloquear Smart Life Pro")' \
            '                                .setSubtitle("Usa tu huella o rostro para entrar")' \
            '                                .setNegativeButton("Usar PIN", getMainExecutor(), (d, w) -> {})' \
            '                                .build();' \
            '                            prompt.authenticate(new CancellationSignal(), getMainExecutor(), new BiometricPrompt.AuthenticationCallback() {' \
            '                                @Override' \
            '                                public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {' \
            '                                    getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript("if(window.Main) Main.unlockApp();", null));' \
            '                                }' \
            '                            });' \
            '                        } else {' \
            '                            KeyguardManager km = (KeyguardManager) getSystemService(Context.KEYGUARD_SERVICE);' \
            '                            if (km != null && km.isKeyguardSecure()) {' \
            '                                getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript("if(window.Main) Main.unlockApp();", null));' \
            '                            }' \
            '                        }' \
            '                    } catch (Exception ignored) {}' \
            '                });' \
            '            }' \
            '        }, "SmartyAndroid");' \
            '        bankReceiver = new BroadcastReceiver() {' \
            '            @Override' \
            '            public void onReceive(Context context, Intent intent) {' \
            '                try {' \
            '                    JSONObject obj = new JSONObject();' \
            '                    obj.put("package", intent.getStringExtra("package"));' \
            '                    obj.put("title", intent.getStringExtra("title"));' \
            '                    obj.put("text", intent.getStringExtra("text"));' \
            '                    final String js = "window.dispatchEvent(new CustomEvent(\x27SmartyBankNotification\x27, { detail: " + obj.toString() + " }));";' \
            '                    getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(js, null));' \
            '                } catch (Exception ignored) {}' \
            '            }' \
            '        };' \
            '        IntentFilter filter = new IntentFilter("SMARTY_BANK_NOTIFICATION");' \
            '        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {' \
            '            registerReceiver(bankReceiver, filter, Context.RECEIVER_NOT_EXPORTED);' \
            '        } else {' \
            '            registerReceiver(bankReceiver, filter);' \
            '        }' \
            '    }' \
            '    @Override' \
            '    public void onDestroy() {' \
            '        if (bankReceiver != null) unregisterReceiver(bankReceiver);' \
            '        super.onDestroy();' \
            '    }' \
            '}' > "$PKG_DIR/MainActivity.java"

          # 3. Permiso de Biometría y Servicio en AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.USE_BIOMETRIC" /><uses-permission android:name="android.permission.USE_FINGERPRINT" /><application|g' android/app/src/main/AndroidManifest.xml
          SERVICE_XML='<service android:name=".SmartyNotificationService" android:label="Smarty Lector Bancario" android:exported="true" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"><intent-filter><action android:name="android.service.notification.NotificationListenerService" /></intent-filter></service></application>'
          sed -i "s|</application>|$SERVICE_XML|g" android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLifePro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
