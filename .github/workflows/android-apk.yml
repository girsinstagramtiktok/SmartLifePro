name: Build Smarty Android APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      REPO_SLUG: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets, Compress Images & Inject V15 Master Addons
        run: |
          sudo apt-get update -y && sudo apt-get install -y imagemagick
          rm -rf www android package.json package-lock.json capacitor.config.json node_modules
          mkdir -p www

          cp index.html style.css manifest.json logo.png www/ 2>/dev/null || true
          cp data.js ui.js assistant.js finance.js shopping.js main.js www/ 2>/dev/null || true
          cp idle.png happy.png worried.png alert.png thinking.png listening.png broke.png www/ 2>/dev/null || true
          if [ -d "skins" ]; then cp -r skins www/; fi

          find www -type f -name "*.png" -exec mogrify -strip -resize "360x360>" -quality 82 {} +

          cat << 'EOF_SCRIPT' > inject_apk.js
          const fs = require("fs");
          const repoSlug = process.env.REPO_SLUG || "";

          if (fs.existsSync("www/assistant.js")) {
            let ast = fs.readFileSync("www/assistant.js", "utf8");
            ast = ast.replace("maxTokens = 650", "maxTokens = 2500");
            fs.writeFileSync("www/assistant.js", ast);
          }

          const addons = [
            "(function() {",
            "  window.SMARTY_APK_VERSION = '15.0';",
            "  window.SMARTY_REPO = '" + repoSlug + "';",
            "",
            "  // 1. ESTILOS NEXT-GEN LIMPIOS (SIN SOMBRA GRIS EN EL ANILLO)",
            "  const st = document.createElement('style');",
            "  st.innerHTML = [",
            "    '#listening-overlay:not(.active), .modal-overlay:not(.open), #custom-confirm:not(.open) { display: none !important; pointer-events: none !important; }',",
            "    '.pin-pad .pin-btn.bio-btn-active { visibility: visible !important; pointer-events: auto !important; color: var(--primary) !important; font-size: 11px !important; font-weight: 800 !important; }',",
            "    'body.dark-mode { --bg-body: #05070B !important; --glass-bg: linear-gradient(145deg, rgba(24,32,48,0.92) 0%, rgba(14,19,30,0.95) 100%) !important; --item-bg: #111726 !important; --input-bg: #192236 !important; }',",
            "    'body.dark-mode .glass-card, body.dark-mode .item-row, body.dark-mode .mascot-compact-row { background: linear-gradient(145deg, rgba(26,35,52,0.92), rgba(15,21,33,0.95)) !important; border-top: 1px solid rgba(255,255,255,0.16) !important; border-left: 1px solid rgba(255,255,255,0.08) !important; box-shadow: 0 14px 34px rgba(0,0,0,0.55) !important; }',",
            "    '#budget-circle { filter: none !important; box-shadow: none !important; transition: stroke-dasharray 0.8s ease, stroke 0.3s ease !important; }',",
            "    '.xp-fill-vertical { background: linear-gradient(to top, #F59E0B, #FDE047) !important; box-shadow: 0 0 10px rgba(251,191,36,0.6) !important; }',",
            "    '.bottom-dock .dock-btn.active { background: rgba(0,110,230,0.14) !important; border-radius: 18px !important; padding: 8px !important; transform: translateY(-2px) !important; }',",
            "    '.brand-logo-real { width: 38px; height: 38px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; margin-right: 12px; flex-shrink: 0; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.14); }',",
            "    '.brand-logo-real svg, .brand-logo-real img { width: 100%; height: 100%; object-fit: cover; display: block; }',",
            "    '.fin-bank-header { margin: 0 16px 14px; padding: 16px 18px; border-radius: 22px; background: var(--primary-grad); color: #fff; box-shadow: 0 12px 28px rgba(0,110,230,0.32); display: flex; justify-content: space-between; align-items: center; }'",
            "  ].join('\\n');",
            "  document.head.appendChild(st);",
            "",
            "  // 2. RENOMBRAR SUSCRIPCIONES A GASTOS FIJOS",
            "  function renameSubscriptionsToFixedExpenses() {",
            "    if (typeof UI === 'undefined' || !UI.dictionary) return;",
            "    if (UI.dictionary.es) { UI.dictionary.es.tab_subs = 'Gastos Fijos'; UI.dictionary.es.btn_add_sub = '+ Nuevo Gasto Fijo'; UI.dictionary.es.mod_sub_title = 'Nuevo Gasto Fijo'; UI.dictionary.es.empty_subs = 'Sin gastos fijos activos.'; }",
            "    if (UI.dictionary.pt) { UI.dictionary.pt.tab_subs = 'Gastos Fixos'; UI.dictionary.pt.btn_add_sub = '+ Novo Gasto Fixo'; UI.dictionary.pt.mod_sub_title = 'Novo Gasto Fixo'; UI.dictionary.pt.empty_subs = 'Sem gastos fixos ativos.'; }",
            "    if (UI.dictionary.en) { UI.dictionary.en.tab_subs = 'Fixed Exp.'; UI.dictionary.en.btn_add_sub = '+ New Fixed Expense'; UI.dictionary.en.mod_sub_title = 'New Fixed Expense'; UI.dictionary.en.empty_subs = 'No active fixed expenses.'; }",
            "  }",
            "",
            "  // 3. LOGOS OFICIALES REALES (NETFLIX, CHATGPT, SPOTIFY, YOUTUBE, DISNEY+, PRIME, UBER, NUBANK, ETC.)",
            "  window.getSmartBrandBadge = function(name) {",
            "    const n = String(name || '').toLowerCase().trim();",
            "    const officialBrands = [",
            "      { match: ['netflix'], svg: '<svg viewBox=\"0 0 48 48\"><rect width=\"48\" height=\"48\" rx=\"10\" fill=\"#000\"/><path fill=\"#E50914\" d=\"M14 8h6l8 21V8h6v32h-6l-8-21v21h-6V8z\"/></svg>' },",
            "      { match: ['chatgpt', 'openai', 'gpt', 'claude'], svg: '<svg viewBox=\"0 0 48 48\"><rect width=\"48\" height=\"48\" rx=\"10\" fill=\"#10A37F\"/><path fill=\"none\" stroke=\"#FFF\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" d=\"M24 12c4.5 0 8 3 8.5 7.2 3.8 1.5 5.5 5.8 3.8 9.6-1.2 2.8-3.8 4.6-6.8 4.8-1.8 3.2-5.8 4.4-9.2 2.8-1.5-.7-2.7-1.9-3.4-3.4-3.8-.5-6.6-3.8-6.4-7.6.1-2 .9-3.8 2.4-5.1-.5-4.2 2.5-8 6.7-8.5 1.5-.2 3 .1 4.4.8z\"/><circle cx=\"24\" cy=\"24\" r=\"3.5\" fill=\"#FFF\"/></svg>' },",
            "      { match: ['spotify'], svg: '<svg viewBox=\"0 0 48 48\"><rect width=\"48\" height=\"48\" rx=\"10\" fill=\"#1DB954\"/><path fill=\"none\" stroke=\"#000\" stroke-width=\"3.4\" stroke-linecap=\"round\" d=\"M13 19c7-2 15-1.5 22 2M15 25.5c5.5-1.5 12-1 17.5 1.8M17 31.5c4-1 9-.8 13 1.2\"/></svg>' },",
            "      { match: ['youtube', 'yt'], svg: '<svg viewBox=\"0 0 48 48\"><rect width=\"48\" height=\"48\" rx=\"10\" fill=\"#FF0000\"/><polygon points=\"20,16 33,24 20,32\" fill=\"#FFF\"/></svg>' },",
            "      { match: ['disney'], domain: 'disneyplus.com' },",
            "      { match: ['prime', 'amazon'], domain: 'primevideo.com' },",
            "      { match: ['max', 'hbo'], domain: 'max.com' },",
            "      { match: ['crunchyroll'], domain: 'crunchyroll.com' },",
            "      { match: ['apple', 'icloud'], domain: 'apple.com' },",
            "      { match: ['google', 'drive', 'one'], domain: 'one.google.com' },",
            "      { match: ['playstation', 'psn', 'ps plus'], domain: 'playstation.com' },",
            "      { match: ['xbox', 'gamepass', 'game pass'], domain: 'xbox.com' },",
            "      { match: ['steam'], domain: 'steampowered.com' },",
            "      { match: ['uber', '99'], domain: 'uber.com' },",
            "      { match: ['ifood', 'rappi', 'pedidosya'], domain: 'ifood.com.br' },",
            "      { match: ['nubank', 'nu '], domain: 'nubank.com.br' },",
            "      { match: ['mercado pago', 'mercadopago', 'meli'], domain: 'mercadopago.com.br' },",
            "      { match: ['inter'], domain: 'inter.co' },",
            "      { match: ['itau', 'itaú'], domain: 'itau.com.br' },",
            "      { match: ['bradesco'], domain: 'bradesco.com.br' },",
            "      { match: ['santander'], domain: 'santander.com.br' },",
            "      { match: ['claro'], domain: 'claro.com.br' },",
            "      { match: ['vivo'], domain: 'vivo.com.br' },",
            "      { match: ['tim'], domain: 'tim.com.br' },",
            "      { match: ['smartfit', 'smart fit', 'gym', 'gimnasio', 'academia'], domain: 'smartfit.com.br' }",
            "    ];",
            "    for (const b of officialBrands) {",
            "      if (b.match.some(k => n.includes(k))) {",
            "        if (b.svg) return '<span class=\"brand-logo-real\">' + b.svg + '</span>';",
            "        return '<span class=\"brand-logo-real\" style=\"background:#fff;\"><img src=\"https://www.google.com/s2/favicons?domain=' + b.domain + '&sz=128\" alt=\"\"></span>';",
            "      }",
            "    }",
            "    if (/(luz|energia|electricidad|enel|cemig)/.test(n)) return '<span class=\"brand-logo-real\" style=\"background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;font-size:19px;\">⚡</span>';",
            "    if (/(agua|saneamiento|sabesp)/.test(n)) return '<span class=\"brand-logo-real\" style=\"background:linear-gradient(135deg,#0EA5E9,#0284C7);color:#fff;font-size:19px;\">💧</span>';",
            "    if (/(internet|wifi|fibra)/.test(n)) return '<span class=\"brand-logo-real\" style=\"background:linear-gradient(135deg,#3B82F6,#1D4ED8);color:#fff;font-size:19px;\">🌐</span>';",
            "    if (/(alquiler|aluguel|renta|casa|condominio)/.test(n)) return '<span class=\"brand-logo-real\" style=\"background:linear-gradient(135deg,#10B981,#047857);color:#fff;font-size:19px;\">🏠</span>';",
            "    return '<span class=\"brand-logo-real\" style=\"background:var(--primary-grad);color:#fff;font-size:18px;\">💳</span>';",
            "  };",
            "",
            "  // 4. SINCRONIZAR SALDO CON EL WIDGET COMPACTO DE SMARTY EN EL ESCRITORIO",
            "  function upgradeBudgetWidgetSync() {",
            "    if (typeof UI === 'undefined' || !UI.renderBudgetChart) return;",
            "    const origChart = UI.renderBudgetChart.bind(UI);",
            "    UI.renderBudgetChart = function() {",
            "      origChart();",
            "      const limit = parseFloat(Data?.store?.budget?.limit || 0);",
            "      const spent = typeof Finance !== 'undefined' ? Finance.calculateMonthlySpent() : 0;",
            "      const remaining = limit - spent;",
            "      const pct = limit > 0 ? Math.min(100, Math.round((spent / limit) * 100)) : 0;",
            "      if (window.SmartyAndroid && window.SmartyAndroid.updateHomeWidget) {",
            "        window.SmartyAndroid.updateHomeWidget(UI.formatMoney(remaining), UI.formatMoney(spent), pct);",
            "      }",
            "    };",
            "  }",
            "",
            "  // 5. SUPER-CONTEXTO TOTAL PARA SMARTY AI",
            "  function stemProduct(name) {",
            "    let s = String(name || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').trim();",
            "    s = s.replace(/[^a-z0-9\\s]/g, '').replace(/\\s+/g, ' ');",
            "    return s.split(' ').map(w => (w.length > 4 && w.endsWith('es')) ? w.slice(0,-2) : ((w.length > 3 && w.endsWith('s')) ? w.slice(0,-1) : w)).join(' ') || 'item';",
            "  }",
            "",
            "  function upgradeSmartyFullDataAccess() {",
            "    if (typeof Assistant === 'undefined') return;",
            "    Assistant.buildCompleteShoppingIndex = function() {",
            "      const groups = {};",
            "      (Data.store.lists || []).filter(l => l.status === 'completed').forEach(list => {",
            "        const dStr = new Date(list.date).toLocaleDateString();",
            "        (list.items || []).filter(i => i.checked !== false).forEach(item => {",
            "          const raw = String(item.name || '').trim(); if (!raw) return;",
            "          const k = stemProduct(raw);",
            "          const q = (typeof Shopping !== 'undefined' && Shopping.parseQtyValue) ? Shopping.parseQtyValue(item.qty) : (parseFloat(item.qty) || 1);",
            "          const p = parseFloat(item.price) || 0;",
            "          if (!groups[k]) groups[k] = { name: raw, vars: new Set(), count: 0, units: 0, spent: 0, prices: [] };",
            "          groups[k].vars.add(raw); groups[k].count += 1; groups[k].units += q; groups[k].spent += (p * q);",
            "          if (p > 0) groups[k].prices.push(dStr + ':' + p.toFixed(2));",
            "        });",
            "      });",
            "      const arr = Object.values(groups).sort((a,b) => b.count - a.count || b.units - a.units);",
            "      if (!arr.length) return 'Sin productos comprados en listas completadas.';",
            "      return arr.slice(0, 60).map(g => '- ' + g.name + ' (variantes: ' + Array.from(g.vars).join('/') + '): comprado ' + g.count + ' veces | unidades: ' + g.units + ' | gasto: ' + g.spent.toFixed(2) + ' | precios: [' + g.prices.slice(-4).join(', ') + ']').join('\\n');",
            "    };",
            "    const origCtx = Assistant.getFinancialContext.bind(Assistant);",
            "    Assistant.getFinancialContext = function(q = '') {",
            "      const base = origCtx(q);",
            "      const idx = this.buildCompleteShoppingIndex();",
            "      const lists = (Data.store.lists || []).filter(l => l.status === 'completed').sort((a,b)=>b.date-a.date).slice(0,15).map(l => new Date(l.date).toLocaleDateString() + ' ' + l.name + ' (' + Number(l.total||0).toFixed(2) + '): ' + (l.items||[]).filter(i=>i.checked!==false).map(i=>i.name + (i.qty?' x'+i.qty:'')).join(', ')).join('\\n');",
            "      const exps = [...(Data.store.expenses || [])].sort((a,b)=>Number(b.date||0)-Number(a.date||0)).slice(0,40).map(e => new Date(e.date).toLocaleDateString() + ' | ' + e.desc + ' | ' + Number(e.amount||0).toFixed(2) + ' | ' + (e.category||'Otros')).join('\\n');",
            "      return base + '\\n\\nRANKING COMPLETO DE PRODUCTOS COMPRADOS EN SUPERMERCADO (AGRUPADOS):\\n' + idx + '\\n\\nDETALLE ULTIMAS 15 LISTAS DE COMPRAS:\\n' + lists + '\\n\\nULTIMOS 40 GASTOS INDIVIDUALES:\\n' + exps + '\\n\\nREGLA CLAVE: Tienes acceso total a todos los productos comprados en listas y gastos. Si un producto tiene variaciones de nombre, plurales o faltas de ortografia, asocialos como el mismo producto y responde con exactitud.';",
            "    };",
            "  }",
            "",
            "  // 6. FINANZAS: EDITAR GASTO, LOGOS REALES Y EXPORTAR PDF",
            "  function upgradeFinanceFeatures() {",
            "    if (typeof Finance === 'undefined') return;",
            "    const origOpenExp = Finance.openExpenseModal.bind(Finance);",
            "    Finance.openExpenseModal = function() { this.editingExpenseId = null; origOpenExp(); };",
            "    Finance.editExistingExpense = function(id) {",
            "      const exp = (Data.store.expenses || []).find(e => e.id === id); if (!exp) return;",
            "      Main.closeModal('expense-detail'); origOpenExp(); this.editingExpenseId = id;",
            "      setTimeout(() => {",
            "        document.getElementById('exp-amount').value = exp.isInstallment && exp.installments?.originalTotal ? exp.installments.originalTotal : exp.amount;",
            "        document.getElementById('exp-desc').value = exp.desc || '';",
            "        document.getElementById('exp-link').value = exp.link || '';",
            "        if (exp.photo) { this.tempPhotoData = exp.photo; const img = document.getElementById('exp-photo-img'); if (img) img.src = exp.photo; document.getElementById('exp-photo-preview-container')?.classList.remove('hidden'); }",
            "        document.querySelectorAll('#cat-chips .cat-chip').forEach(c => {",
            "          const match = c.dataset.id === exp.category || UI.t(c.dataset.id) === exp.category;",
            "          c.classList.toggle('selected', match);",
            "          c.style.background = match ? 'var(--primary)' : 'var(--glass-bg)'; c.style.color = match ? 'white' : 'var(--text-color)';",
            "        });",
            "      }, 80);",
            "    };",
            "    const origSaveExp = Finance.saveExpense.bind(Finance);",
            "    Finance.saveExpense = function() {",
            "      if (this.editingExpenseId) {",
            "        const oldIdx = (Data.store.expenses || []).findIndex(e => e.id === this.editingExpenseId);",
            "        const oldDate = oldIdx >= 0 ? Data.store.expenses[oldIdx].date : Date.now();",
            "        if (oldIdx >= 0) Data.store.expenses.splice(oldIdx, 1);",
            "        this.editingExpenseId = null; origSaveExp();",
            "        const last = Data.store.expenses[Data.store.expenses.length - 1];",
            "        if (last) { last.date = oldDate; Data.save(); }",
            "        this.renderExpensesHistory(); return;",
            "      }",
            "      origSaveExp();",
            "    };",
            "    const origDetail = Finance.openExpenseDetail.bind(Finance);",
            "    Finance.openExpenseDetail = function(id) {",
            "      origDetail(id);",
            "      const delBtn = document.getElementById('det-exp-delete-btn');",
            "      if (delBtn && !document.getElementById('det-exp-edit-btn')) {",
            "        const editBtn = document.createElement('button'); editBtn.id = 'det-exp-edit-btn'; editBtn.className = 'btn-full'; editBtn.style.marginBottom = '10px'; editBtn.innerHTML = '✏️ Editar Gasto';",
            "        delBtn.parentNode.insertBefore(editBtn, delBtn);",
            "      }",
            "      const eb = document.getElementById('det-exp-edit-btn'); if (eb) eb.onclick = () => Finance.editExistingExpense(id);",
            "    };",
            "    const origSubs = Finance.renderSubscriptions.bind(Finance);",
            "    Finance.renderSubscriptions = function() {",
            "      origSubs();",
            "      const listEl = document.getElementById('subs-list'); if (!listEl) return;",
            "      listEl.querySelectorAll('.item-row').forEach(row => {",
            "        row.querySelectorAll('.brand-badge, .brand-logo-real').forEach(e => e.remove());",
            "        const titleEl = row.querySelector('div[style*=\"font-weight:700\"]') || row.querySelector('div[style*=\"font-weight:800\"]');",
            "        if (titleEl) row.insertAdjacentHTML('afterbegin', window.getSmartBrandBadge(titleEl.innerText));",
            "      });",
            "      this.injectFinanceSummaryBanner();",
            "    };",
            "    Finance.injectFinanceSummaryBanner = function() {",
            "      const viewFin = document.querySelector('#view-finance .scroll-content'); if (!viewFin) return;",
            "      let banner = document.getElementById('fin-bank-summary-banner');",
            "      if (!banner) { banner = document.createElement('div'); banner.id = 'fin-bank-summary-banner'; banner.className = 'fin-bank-header'; viewFin.insertBefore(banner, viewFin.firstChild); }",
            "      const subsTotal = (Data.store.subscriptions || []).reduce((s, x) => s + (parseFloat(x.cost) || 0), 0);",
            "      const instTotal = (Data.store.expenses || []).filter(e => e.isInstallment).reduce((s, x) => {",
            "        const p = Finance.calculateProgress(x.date, x.installments?.total || 1);",
            "        return (p.current > 0 && p.current <= (x.installments?.total || 1)) ? s + (parseFloat(x.amount) || 0) : s;",
            "      }, 0);",
            "      const limit = parseFloat(Data.store.budget?.limit || 0);",
            "      const committedPct = limit > 0 ? Math.round(((subsTotal + instTotal) / limit) * 100) : 0;",
            "      banner.innerHTML = '<div><div style=\"font-size:10px; text-transform:uppercase; opacity:0.85; font-weight:800;\">Compromiso Fijo Mensual</div><div style=\"font-size:22px; font-weight:900; margin-top:2px;\">' + UI.formatMoney(subsTotal + instTotal) + '</div><div style=\"font-size:11px; opacity:0.9; margin-top:2px;\">Fijos: ' + UI.formatMoney(subsTotal) + ' · Parcelas: ' + UI.formatMoney(instTotal) + '</div></div><div style=\"text-align:right;\"><div style=\"font-size:20px; font-weight:900;\">' + committedPct + '%</div><div style=\"font-size:10px; opacity:0.85;\">del presupuesto</div></div>';",
            "    };",
            "    const origHist = Finance.renderExpensesHistory.bind(Finance);",
            "    Finance.renderExpensesHistory = function() {",
            "      origHist(); this.injectFinanceSummaryBanner();",
            "      const container = document.getElementById('expenses-history-list');",
            "      if (container && !document.getElementById('btn-export-pdf-month')) {",
            "        const btn = document.createElement('button'); btn.id = 'btn-export-pdf-month'; btn.className = 'btn-data'; btn.style.cssText = 'width:calc(100% - 32px); margin:0 16px 14px; padding:12px; flex-direction:row; font-size:13px;'; btn.innerHTML = '📄 Exportar Resumen Detallado en PDF';",
            "        btn.onclick = () => Finance.exportMonthlyPDF();",
            "        container.insertBefore(btn, container.children[1] || container.firstChild);",
            "      }",
            "    };",
            "    Finance.exportMonthlyPDF = function() {",
            "      const [selY, selM] = (this.selectedHistoryMonth || '2026-10').split('-').map(Number);",
            "      const monthTitle = UI.getMonthName(selM - 1) + ' ' + selY;",
            "      const limit = parseFloat(Data.store.budget?.limit || 0);",
            "      const rows = []; const cats = {}; let total = 0;",
            "      const addRow = (date, type, desc, cat, amt) => { const n = parseFloat(amt) || 0; total += n; cats[cat] = (cats[cat] || 0) + n; rows.push({ date, type, desc, cat, amt: n }); };",
            "      (Data.store.expenses || []).forEach(e => {",
            "        const d = new Date(e.date);",
            "        if (!e.isInstallment && d.getMonth() === (selM - 1) && d.getFullYear() === selY) addRow(d.toLocaleDateString(), 'Gasto', e.desc, e.category || 'Otros', e.amount);",
            "        else if (e.isInstallment) { const target = new Date(selY, selM - 1, 1); const { current } = Finance.calculateProgressAtDate(e.date, e.installments.total, target); if (current > 0 && current <= e.installments.total) addRow(target.toLocaleDateString(), 'Parcela ' + current + '/' + e.installments.total, e.desc, e.category || 'Otros', e.amount); }",
            "      });",
            "      (Data.store.lists || []).filter(l => l.status === 'completed').forEach(l => { const d = new Date(l.date); if (d.getMonth() === (selM - 1) && d.getFullYear() === selY) addRow(d.toLocaleDateString(), 'Mercado', l.name, UI.t('cat_market'), l.total); });",
            "      (Data.store.subscriptions || []).forEach(s => addRow('Dia ' + s.day, 'Gasto Fijo', s.name, 'Gastos Fijos', s.cost));",
            "      const catRows = Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,a]) => '<tr><td>' + c + '</td><td>' + UI.formatMoney(a) + '</td><td>' + (total>0?Math.round((a/total)*100):0) + '%</td></tr>').join('');",
            "      const movRows = rows.map(r => '<tr><td>' + r.date + '</td><td>' + r.type + '</td><td>' + r.desc + '</td><td>' + r.cat + '</td><td style=\"text-align:right;font-weight:bold;\">' + UI.formatMoney(r.amt) + '</td></tr>').join('');",
            "      const htmlReport = '<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><style>body{font-family:sans-serif;padding:24px;color:#0f172a}h1{color:#0066ff;margin:0 0 4px}table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12px}th,td{border:1px solid #cbd5e1;padding:8px;text-align:left}th{background:#f1f5f9}.cards{display:flex;gap:12px;margin:16px 0}.card{flex:1;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid #e2e8f0}</style></head><body><h1>Smart Life Pro - Informe Mensual</h1><div>Periodo: <b>' + monthTitle + '</b></div><div class=\"cards\"><div class=\"card\"><div>Presupuesto</div><b style=\"font-size:18px;\">' + UI.formatMoney(limit) + '</b></div><div class=\"card\"><div>Total Gastado</div><b style=\"font-size:18px;color:#ef4444;\">' + UI.formatMoney(total) + '</b></div><div class=\"card\"><div>Saldo</div><b style=\"font-size:18px;color:#10b981;\">' + UI.formatMoney(limit - total) + '</b></div></div><h3>Desglose por Categorias</h3><table><tr><th>Categoria</th><th>Monto</th><th>%</th></tr>' + catRows + '</table><h3>Detalle de Movimientos (' + rows.length + ')</h3><table><tr><th>Fecha</th><th>Tipo</th><th>Descripcion</th><th>Categoria</th><th>Monto</th></tr>' + movRows + '</table></body></html>';",
            "      if (window.SmartyAndroid && window.SmartyAndroid.printHtmlToPdf) window.SmartyAndroid.printHtmlToPdf(htmlReport, 'Smarty_Resumen_' + this.selectedHistoryMonth);",
            "    };",
            "  }",
            "",
            "  // 7. COMPRA INVERSA POR FOTO",
            "  function upgradeReverseReceiptShopping() {",
            "    if (typeof Shopping === 'undefined') return;",
            "    const topBar = document.querySelector('#view-lists .top-bar > div');",
            "    if (topBar && !document.getElementById('lists-scan-ticket-btn')) {",
            "      const lbl = document.createElement('label'); lbl.id = 'lists-scan-ticket-btn'; lbl.className = 'icon-btn'; lbl.style.cssText = 'width:auto; padding:0 8px; font-size:11px; font-weight:800; gap:3px; cursor:pointer;';",
            "      lbl.innerHTML = '<span>📸</span><span>Ticket</span><input type=\"file\" accept=\"image/*\" style=\"display:none;\" onchange=\"Shopping.createCompletedListFromReceipt(this)\">';",
            "      topBar.insertBefore(lbl, topBar.firstChild);",
            "    }",
            "    Shopping.createCompletedListFromReceipt = async function(input) {",
            "      const file = input.files && input.files[0]; if (!file) return;",
            "      if (typeof GroqAI === 'undefined' || !GroqAI.getApiKey()) return;",
            "      input.value = ''; UI.showSnackbar('⏳ Leyendo todos los productos y precios del recibo...');",
            "      try {",
            "        const base64Data = await Finance.compressImage(file, 1200, 0.75);",
            "        const rawBase64 = base64Data.split(',')[1];",
            "        const prompt = 'Analyze this supermarket receipt image. Extract the store name (if visible), the final total paid, and EVERY purchased product with its quantity and unit price. Return ONLY JSON: {\"storeName\": \"Mercado\", \"receiptTotal\": 85.50, \"items\": [{\"name\": \"Leche\", \"qty\": \"2\", \"unitPrice\": 4.50}]}';",
            "        const res = await GroqAI.visionJSON(prompt, rawBase64);",
            "        const rawItems = Array.isArray(res?.items) ? res.items : [];",
            "        if (!rawItems.length) { UI.showSnackbar('No se pudieron leer productos en la foto'); return; }",
            "        this.createList(true);",
            "        const list = Data.store.lists.find(l => l.id === Data.store.currentId) || Data.store.lists[0];",
            "        if (res.storeName) list.name = String(res.storeName).slice(0, 40);",
            "        list.items = rawItems.map(i => {",
            "          const nm = String(i.name || 'Producto').trim();",
            "          const pr = Number(i.unitPrice) > 0 ? Number(i.unitPrice) : 0;",
            "          if (pr > 0) Data.store.prices[this.normalize(nm)] = pr;",
            "          return { name: nm.charAt(0).toUpperCase() + nm.slice(1), qty: String(i.qty || '1').trim(), checked: true, price: pr };",
            "        });",
            "        Data.save(); this.openShoppingView();",
            "        setTimeout(() => {",
            "          this.finishList();",
            "          if (Number(res.receiptTotal) > 0) { const manual = document.getElementById('finish-manual-total'); if (manual) { manual.value = Number(res.receiptTotal).toFixed(2); this.updateFinishTotal(); } }",
            "          UI.showSnackbar('✨ Lista creada con ' + list.items.length + ' productos lista para guardar');",
            "        }, 250);",
            "      } catch(err) { UI.showSnackbar(GroqAI.friendlyError(err) || 'Error leyendo el recibo'); }",
            "    };",
            "  }",
            "",
            "  // 8. EXTRACTOR BANCARIO INTELIGENTE (EXTRAE COMERCIO REAL Y MONTO, IGNORA 'COMPRA APROBADA')",
            "  function extractCleanBankDataOffline(title, text) {",
            "    const full = ((title || '') + ' | ' + (text || '')).trim();",
            "    const moneyRegex = /(?:r\\$|\\$|usd|brl|eur|valor|por|de)?\\s*(\\d{1,3}(?:\\.\\d{3})*(?:,\\d{1,2})|\\d+(?:\\.\\d{1,2})?)/gi;",
            "    let amount = 0; let m;",
            "    while ((m = moneyRegex.exec(text || full)) !== null) {",
            "      let rawNum = m[1];",
            "      if (rawNum.includes(',') && rawNum.includes('.')) rawNum = rawNum.replace(/\\./g, '').replace(',', '.');",
            "      else if (rawNum.includes(',')) rawNum = rawNum.replace(',', '.');",
            "      const val = parseFloat(rawNum);",
            "      if (val > 0 && val < 1000000) { amount = val; break; }",
            "    }",
            "    let merchant = '';",
            "    const afterPrep = (text || full).match(/(?:\\ben\\b|\\bem\\b|\\bno\\b|\\bna\\b|\\bpara\\b|\\bat\\b|\\bto\\b|\\bestabelecimento\\b|\\bcomercio\\b)\\s+([A-Za-zÀ-ÿ0-9\\s.*&-]{2,35}?)(?:\\s+(?:por|no valor|de|r\\$|\\$|el dia|em \\d|aprovad|aprobad|con tu|com seu|final|\\.|,)|$)/i);",
            "    if (afterPrep && afterPrep[1]) {",
            "      merchant = afterPrep[1].trim();",
            "    } else {",
            "      merchant = String(text || '')",
            "        .replace(/(compra|pagamento|pago|transferencia|transferência|pix)\\s*(de|no|en|con|com|por)?\\s*(credito|crédito|debito|débito|cartao|cartão|tarjeta)?\\s*(aprovada|aprovado|aprobada|aprobado|realizada|enviado|enviada)?/gi, '')",
            "        .replace(/(?:r\\$|\\$|usd|brl|eur)\\s*\\d+(?:[.,]\\d+)?/gi, '')",
            "        .replace(/\\b(por|no valor de|valor de|de|en|em|para|com|con|tu tarjeta|seu cartao|final \\d+)\\b/gi, ' ')",
            "        .replace(/[.,:;!?|()-]/g, ' ').replace(/\\s+/g, ' ').trim();",
            "    }",
            "    if (!merchant || merchant.length < 2) merchant = 'Pago con Tarjeta';",
            "    merchant = merchant.charAt(0).toUpperCase() + merchant.slice(1);",
            "    const mLow = merchant.toLowerCase();",
            "    let category = 'cat_other';",
            "    if (/(uber|99|taxi|cabify|gasolina|posto|shell|ipiranga|metro|onibus)/.test(mLow)) category = 'cat_transport';",
            "    else if (/(mercado|super|carrefour|atacadao|assai|pao de acucar|extra|dia|walmart|padaria|panaderia)/.test(mLow)) category = 'cat_market';",
            "    else if (/(ifood|rappi|burger|mcdonald|pizza|restaurante|bar|cafe|cafeteria|starbucks|sushi|lanchonete|cine)/.test(mLow)) category = 'cat_leisure';",
            "    else if (/(farmacia|droga|raia|drogasil|pacheco|hospital|clinica|medico|dentista)/.test(mLow)) category = 'cat_health';",
            "    else if (/(zara|nike|adidas|shein|renner|riachuelo|cea|ropa)/.test(mLow)) category = 'cat_clothes';",
            "    return { amount, merchant, category };",
            "  }",
            "",
            "  // 9. AUTO-UPDATER QUE EJECUTA OTA DESPUES DEL LOAD Y DESCARGA APK",
            "  window.SmartyUpdaterAndBackup = {",
            "    checkDailyAutoBackup() {",
            "      if (!Data?.store?.settings?.autoDailyBackup) return;",
            "      const today = new Date().toISOString().slice(0, 10);",
            "      if (localStorage.getItem('smarty_last_autobackup') !== today) { this.runOverwriteBackup(true); localStorage.setItem('smarty_last_autobackup', today); }",
            "    },",
            "    runOverwriteBackup(silent = false) {",
