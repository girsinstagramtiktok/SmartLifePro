            "            Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);",
            "            intent.addCategory(Intent.CATEGORY_OPENABLE);",
            "            intent.setType(\"application/json\");",
            "            intent.putExtra(Intent.EXTRA_TITLE, fileName);",
            "            startActivityForResult(intent, CREATE_BACKUP_JSON);",
            "        }",
            "        @JavascriptInterface",
            "        public void authenticateBiometric() {",
            "            runOnUiThread(new Runnable() {",
            "                @Override",
            "                public void run() {",
            "                    try {",
            "                        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {",
            "                            BiometricPrompt prompt = new BiometricPrompt.Builder(MainActivity.this)",
            "                                .setTitle(\"Desbloquear Smart Life Pro\")",
            "                                .setSubtitle(\"Usa tu huella o rostro para entrar\")",
            "                                .setNegativeButton(\"Usar PIN\", getMainExecutor(), new DialogInterface.OnClickListener() {",
            "                                    @Override",
            "                                    public void onClick(DialogInterface dialog, int which) {}",
            "                                })",
            "                                .build();",
            "                            prompt.authenticate(new CancellationSignal(), getMainExecutor(), new BiometricPrompt.AuthenticationCallback() {",
            "                                @Override",
            "                                public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {",
            "                                    getBridge().getWebView().post(new Runnable() {",
            "                                        @Override",
            "                                        public void run() {",
            "                                            getBridge().getWebView().evaluateJavascript(\"if(window.Main) Main.unlockApp();\", null);",
            "                                        }",
            "                                    });",
            "                                }",
            "                            });",
            "                        }",
            "                    } catch (Exception ignored) {}",
            "                }",
            "            });",
            "        }",
            "    }",
            "    @Override",
            "    protected void onActivityResult(int requestCode, int resultCode, Intent data) {",
            "        super.onActivityResult(requestCode, resultCode, data);",
            "        if (requestCode == PICK_RESTORE_JSON && resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {",
            "            try {",
            "                Uri uri = data.getData();",
            "                InputStream is = getContentResolver().openInputStream(uri);",
            "                BufferedReader reader = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));",
            "                StringBuilder sb = new StringBuilder();",
            "                String line;",
            "                while ((line = reader.readLine()) != null) sb.append(line).append(\"\\n\");",
            "                reader.close();",
            "                String b64 = Base64.encodeToString(sb.toString().getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);",
            "                final String js = \"if(window._onAndroidBackupFileRestored) window._onAndroidBackupFileRestored(decodeURIComponent(escape(atob('\" + b64 + \"'))));\";",
            "                getBridge().getWebView().post(new Runnable() {",
            "                    @Override",
            "                    public void run() {",
            "                        getBridge().getWebView().evaluateJavascript(js, null);",
            "                    }",
            "                });",
            "            } catch (Exception ignored) {}",
            "        } else if (requestCode == CREATE_BACKUP_JSON && resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {",
            "            try {",
            "                Uri uri = data.getData();",
            "                OutputStream os = getContentResolver().openOutputStream(uri);",
            "                os.write(pendingBackupContent.getBytes(StandardCharsets.UTF_8));",
            "                os.close();",
            "                getBridge().getWebView().post(new Runnable() {",
            "                    @Override",
            "                    public void run() {",
            "                        getBridge().getWebView().evaluateJavascript(\"if(window.UI) UI.showSnackbar('Copia guardada correctamente');\", null);",
            "                    }",
            "                });",
            "            } catch (Exception ignored) {}",
            "        }",
            "    }",
            "    @Override",
            "    protected void onCreate(Bundle savedInstanceState) {",
            "        super.onCreate(savedInstanceState);",
            "        enableImmersiveNavigation();",
            "        if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {",
            "            ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA, Manifest.permission.POST_NOTIFICATIONS}, 101);",
            "        }",
            "        getBridge().getWebView().addJavascriptInterface(new SmartyJSBridge(), \"SmartyAndroid\");",
            "        handleWidgetIntent(getIntent());",
            "        bankReceiver = new BroadcastReceiver() {",
            "            @Override",
            "            public void onReceive(Context context, Intent intent) {",
            "                try {",
            "                    SharedPreferences prefs = getSharedPreferences(\"smarty_bank_queue\", MODE_PRIVATE);",
            "                    prefs.edit().putString(\"queue\", \"[]\").apply();",
            "                    JSONObject obj = new JSONObject();",
            "                    obj.put(\"package\", intent.getStringExtra(\"package\"));",
            "                    obj.put(\"title\", intent.getStringExtra(\"title\"));",
            "                    obj.put(\"text\", intent.getStringExtra(\"text\"));",
            "                    final String js = \"window.dispatchEvent(new CustomEvent('SmartyBankNotification', { detail: \" + obj.toString() + \" }));\";",
            "                    getBridge().getWebView().post(new Runnable() {",
            "                        @Override",
            "                        public void run() {",
            "                            getBridge().getWebView().evaluateJavascript(js, null);",
            "                        }",
            "                    });",
            "                } catch (Exception ignored) {}",
            "            }",
            "        };",
            "        IntentFilter filter = new IntentFilter(\"SMARTY_BANK_NOTIFICATION\");",
            "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {",
            "            registerReceiver(bankReceiver, filter, Context.RECEIVER_NOT_EXPORTED);",
            "        } else {",
            "            registerReceiver(bankReceiver, filter);",
            "        }",
            "    }",
            "    @Override",
            "    public void onDestroy() {",
            "        if (bankReceiver != null) unregisterReceiver(bankReceiver);",
            "        super.onDestroy();",
            "    }",
            "}"
          ].join("\n");
          fs.writeFileSync(pkgDir + "/MainActivity.java", mainActivity);

          let manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          if (!manifest.includes("USE_BIOMETRIC")) {
              manifest = manifest.replace("<application", "<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.USE_BIOMETRIC\" />\n    <uses-permission android:name=\"android.permission.USE_FINGERPRINT\" />\n    <application");
          }
          if (!manifest.includes("SmartyNotificationService")) {
              const servicesAndWidget = [
                "<service android:name=\".SmartyNotificationService\" android:label=\"Smarty Lector Bancario\" android:exported=\"true\" android:permission=\"android.permission.BIND_NOTIFICATION_LISTENER_SERVICE\"><intent-filter><action android:name=\"android.service.notification.NotificationListenerService\" /></intent-filter></service>",
                "<receiver android:name=\".SmartyWidgetProvider\" android:exported=\"true\" android:label=\"Smarty Finanzas\"><intent-filter><action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" /></intent-filter><meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/smarty_widget_info\" /></receiver>",
                "</application>"
              ].join("\n    ");
              manifest = manifest.replace("</application>", servicesAndWidget);
          }
          fs.writeFileSync("android/app/src/main/AndroidManifest.xml", manifest);
          EOF_JAVA

          node setup_java.js
          rm -f setup_java.js

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../SmartLifePro-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLifePro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest SmartLifePro-latest.apk --title "Smart Life Pro V15" --notes "Actualizacion automatica" || true
