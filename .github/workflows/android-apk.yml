name: Build Smarty Android APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets & Connect smarty-ota.js
        run: |
          rm -rf www android package.json package-lock.json capacitor.config.json node_modules
          mkdir -p www

          cp *.html *.css *.js *.json *.png www/ 2>/dev/null || true
          if [ -d "skins" ]; then cp -r skins www/; fi
          rm -f www/paquete*.html www/descargar*.html www/bg1.png www/bg2.png www/bg3.png www/bg4.png www/bg5.png

          if command -v mogrify >/dev/null 2>&1; then
            find www -type f -name "*.png" -exec mogrify -strip -resize "360x360>" -quality 82 {} + || true
          fi

          node -e '
          const fs = require("fs");
          if (fs.existsSync("www/assistant.js")) {
            let ast = fs.readFileSync("www/assistant.js", "utf8");
            ast = ast.replace("maxTokens = 650", "maxTokens = 2500");
            fs.writeFileSync("www/assistant.js", ast);
          }

          const boot = `
          (function() {
            window.addEventListener("load", () => {
              setTimeout(() => {
                try {
                  const savedOta = localStorage.getItem("smarty_ota_live");
                  if (savedOta) eval(savedOta);
                } catch(e) {}
              }, 500);
            });
          })();
          `;
          fs.writeFileSync("www/smarty-boot.js", boot);

          if (fs.existsSync("www/index.html")) {
            let html = fs.readFileSync("www/index.html", "utf8");
            html = html.replace(/serviceWorker/g, "serviceWorkerDisabledInAPK");
            let scripts = "<script src=\"main.js\"></script>";
            if (fs.existsSync("www/smarty-ota.js")) scripts += "\n<script src=\"smarty-ota.js\"></script>";
            scripts += "\n<script src=\"smarty-boot.js\"></script>";
            html = html.replace("<script src=\"main.js\"></script>", scripts);
            fs.writeFileSync("www/index.html", html);
          }

          fs.writeFileSync("capacitor.config.json", JSON.stringify({
            appId: "com.smartlife.pro",
            appName: "Smart Life Pro",
            webDir: "www"
          }, null, 2));
          '

          npm init -y
          npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2 @capacitor/local-notifications@6.1.0 @capacitor/preferences@6.0.2
          npx cap add android
          npx cap sync android

      - name: Inject Native Installed Apps Reader, Strict Filter, Widget & Immersive Mode
        run: |
          if [ -f "www/logo.png" ] && command -v convert >/dev/null 2>&1; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in android/app/src/main/res/mipmap-*; do
              if [ -d "$d" ]; then
                convert www/logo.png -resize 192x192 "PNG32:$d/ic_launcher.png" || true
                convert www/logo.png -resize 192x192 "PNG32:$d/ic_launcher_round.png" || true
                convert www/logo.png -resize 192x192 "PNG32:$d/ic_launcher_foreground.png" || true
              fi
            done
          fi

          if [ -f "www/idle.png" ] && command -v convert >/dev/null 2>&1; then
            for d in android/app/src/main/res/mipmap-*; do
              if [ -d "$d" ]; then
                convert www/idle.png -resize 140x140 "PNG32:$d/smarty_mascot.png" || true
              fi
            done
          fi

          cat << 'EOF_JAVA' > setup_java.js
          const fs = require("fs");
          const pkgDir = "android/app/src/main/java/com/smartlife/pro";
          const resLayoutDir = "android/app/src/main/res/layout";
          const resXmlDir = "android/app/src/main/res/xml";
          fs.mkdirSync(pkgDir, { recursive: true });
          fs.mkdirSync(resLayoutDir, { recursive: true });
          fs.mkdirSync(resXmlDir, { recursive: true });

          let buildGradle = fs.readFileSync("android/app/build.gradle", "utf8");
          buildGradle = buildGradle.replace("defaultConfig {", "defaultConfig {\n        ndk {\n            abiFilters 'arm64-v8a', 'armeabi-v7a'\n        }");
          fs.writeFileSync("android/app/build.gradle", buildGradle);

          fs.writeFileSync(resLayoutDir + "/smarty_widget.xml", [
            '<?xml version="1.0" encoding="utf-8"?>',
            '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical" android:padding="10dp" android:background="@android:color/background_dark">',
            '  <ImageView android:id="@+id/widget_mascot" android:layout_width="44dp" android:layout_height="44dp" android:src="@mipmap/ic_launcher" android:layout_marginEnd="10dp" />',
            '  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">',
            '    <TextView android:text="DISPONIBLE" android:textColor="#94A3B8" android:textSize="9sp" android:textStyle="bold" android:layout_width="wrap_content" android:layout_height="wrap_content"/>',
            '    <TextView android:id="@+id/widget_remaining" android:text="$0.00" android:textColor="#10B981" android:textSize="17sp" android:textStyle="bold" android:singleLine="true" android:layout_width="wrap_content" android:layout_height="wrap_content"/>',
            '    <TextView android:id="@+id/widget_spent" android:text="Gastado: $0" android:textColor="#F8FAFC" android:textSize="10sp" android:singleLine="true" android:layout_width="wrap_content" android:layout_height="wrap_content"/>',
            '  </LinearLayout>',
            '  <Button android:id="@+id/widget_btn_expense" android:text="+ Gasto" android:textColor="#FFFFFF" android:textSize="11sp" android:backgroundTint="#0066FF" android:layout_width="76dp" android:layout_height="38dp" android:layout_marginEnd="6dp"/>',
            '  <Button android:id="@+id/widget_btn_lists" android:text="Listas" android:textColor="#FFFFFF" android:textSize="11sp" android:backgroundTint="#10B981" android:layout_width="70dp" android:layout_height="38dp"/>',
            '</LinearLayout>'
          ].join("\n"));

          fs.writeFileSync(resXmlDir + "/smarty_widget_info.xml", [
            '<?xml version="1.0" encoding="utf-8"?>',
            '<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="250dp" android:minHeight="50dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/smarty_widget" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen" />'
          ].join("\n"));

          fs.writeFileSync(pkgDir + "/SmartyWidgetProvider.java", [
            "package com.smartlife.pro;",
            "import android.app.PendingIntent; import android.appwidget.AppWidgetManager; import android.appwidget.AppWidgetProvider; import android.content.ComponentName; import android.content.Context; import android.content.Intent; import android.content.SharedPreferences; import android.widget.RemoteViews;",
            "public class SmartyWidgetProvider extends AppWidgetProvider {",
            "  public static void updateAllWidgets(Context c) { AppWidgetManager m = AppWidgetManager.getInstance(c); int[] ids = m.getAppWidgetIds(new ComponentName(c, SmartyWidgetProvider.class)); for (int id : ids) updateOne(c, m, id); }",
            "  private static void updateOne(Context c, AppWidgetManager m, int id) {",
            "    SharedPreferences p = c.getSharedPreferences(\"smarty_widget_prefs\", Context.MODE_PRIVATE);",
            "    RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.smarty_widget);",
            "    v.setTextViewText(R.id.widget_remaining, p.getString(\"remaining\", \"$0.00\"));",
            "    v.setTextViewText(R.id.widget_spent, \"Gastado: \" + p.getString(\"spent\", \"$0.00\"));",
            "    Intent eI = new Intent(c, MainActivity.class); eI.putExtra(\"widget_action\", \"expense\"); eI.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);",
            "    v.setOnClickPendingIntent(R.id.widget_btn_expense, PendingIntent.getActivity(c, 101, eI, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));",
            "    Intent lI = new Intent(c, MainActivity.class); lI.putExtra(\"widget_action\", \"lists\"); lI.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);",
            "    v.setOnClickPendingIntent(R.id.widget_btn_lists, PendingIntent.getActivity(c, 102, lI, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));",
            "    m.updateAppWidget(id, v);",
            "  }",
            "  @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids) { for (int id : ids) updateOne(c, m, id); }",
            "}"
          ].join("\n"));

          fs.writeFileSync(pkgDir + "/SmartyNotificationService.java", [
            "package com.smartlife.pro;",
            "import android.app.Notification; import android.content.SharedPreferences; import android.os.Bundle; import android.service.notification.NotificationListenerService; import android.service.notification.StatusBarNotification; import android.content.Intent; import org.json.JSONArray; import org.json.JSONObject;",
            "public class SmartyNotificationService extends NotificationListenerService {",
            "  @Override public void onNotificationPosted(StatusBarNotification sbn) {",
            "    if (sbn == null) return;",
            "    String pkg = sbn.getPackageName();",
            "    if (pkg == null) return;",
            "    if (!pkg.equals(\"com.smartlife.pro\")) {",
            "      SharedPreferences fp = getSharedPreferences(\"smarty_allowed_pkgs\", MODE_PRIVATE);",
            "      String csv = fp.getString(\"pkgs\", \"\");",
            "      if (csv == null || csv.isEmpty()) return;",
            "      boolean ok = false;",
            "      for (String allowed : csv.split(\",\")) {",
            "        if (!allowed.trim().isEmpty() && pkg.equalsIgnoreCase(allowed.trim())) { ok = true; break; }",
            "      }",
            "      if (!ok) return;",
            "    }",
            "    if (sbn.getNotification() == null || sbn.getNotification().extras == null) return;",
            "    Bundle ex = sbn.getNotification().extras;",
            "    CharSequence tCs = ex.getCharSequence(Notification.EXTRA_TITLE);",
            "    CharSequence bCs = ex.getCharSequence(Notification.EXTRA_TEXT);",
            "    String title = tCs != null ? tCs.toString() : \"\";",
            "    String text = bCs != null ? bCs.toString() : \"\";",
            "    if (title.isEmpty() && text.isEmpty()) return;",
            "    if (pkg.equals(\"com.smartlife.pro\") && !title.contains(\"Compra\")) return;",
            "    try {",
            "      SharedPreferences qP = getSharedPreferences(\"smarty_bank_queue\", MODE_PRIVATE);",
            "      JSONArray arr = new JSONArray(qP.getString(\"queue\", \"[]\"));",
            "      JSONObject item = new JSONObject(); item.put(\"package\", pkg); item.put(\"title\", title); item.put(\"text\", text);",
            "      arr.put(item); qP.edit().putString(\"queue\", arr.toString()).apply();",
            "    } catch (Exception ignored) {}",
            "    Intent i = new Intent(\"SMARTY_BANK_NOTIFICATION\"); i.setPackage(getPackageName());",
            "    i.putExtra(\"package\", pkg); i.putExtra(\"title\", title); i.putExtra(\"text\", text);",
            "    sendBroadcast(i);",
            "  }",
            "}"
          ].join("\n"));

          fs.writeFileSync(pkgDir + "/MainActivity.java", [
            "package com.smartlife.pro;",
            "import android.Manifest; import android.app.Activity; import android.app.NotificationChannel; import android.app.NotificationManager; import android.content.BroadcastReceiver; import android.content.Context; import android.content.Intent; import android.content.IntentFilter; import android.content.SharedPreferences; import android.content.pm.PackageManager; import android.content.pm.ResolveInfo; import android.hardware.biometrics.BiometricPrompt; import android.net.Uri; import android.os.Build; import android.os.Bundle; import android.os.CancellationSignal; import android.os.Environment; import android.print.PrintAttributes; import android.print.PrintManager; import android.provider.Settings; import android.util.Base64; import android.view.View; import android.view.WindowInsets; import android.view.WindowInsetsController; import android.webkit.JavascriptInterface; import android.webkit.WebView; import android.webkit.WebViewClient; import androidx.core.app.ActivityCompat; import androidx.core.app.NotificationCompat; import androidx.core.content.ContextCompat; import com.getcapacitor.BridgeActivity; import java.io.BufferedReader; import java.io.File; import java.io.FileOutputStream; import java.io.InputStream; import java.io.InputStreamReader; import java.io.OutputStream; import java.nio.charset.StandardCharsets; import java.util.HashSet; import java.util.List; import org.json.JSONArray; import org.json.JSONObject;",
            "public class MainActivity extends BridgeActivity {",
            "  private BroadcastReceiver bankReceiver;",
            "  private static final int PICK_RESTORE_JSON = 9901;",
            "  private static final int CREATE_BACKUP_JSON = 9902;",
            "  private String pendingBackupContent = \"\";",
            "  private WebView pdfWebView;",
            "  private void hideSysNav() {",
            "    try {",
            "      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {",
            "        WindowInsetsController c = getWindow().getInsetsController();",
            "        if (c != null) { c.hide(WindowInsets.Type.navigationBars()); c.setSystemBarsBehavior(WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE); }",
            "      } else { getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY); }",
            "    } catch (Exception ignored) {}",
            "  }",
            "  @Override public void onWindowFocusChanged(boolean hasFocus) { super.onWindowFocusChanged(hasFocus); if (hasFocus) hideSysNav(); }",
            "  @Override protected void onNewIntent(Intent intent) { super.onNewIntent(intent); handleWidget(intent); }",
            "  private void handleWidget(Intent intent) {",
            "    if (intent == null) return;",
            "    final String act = intent.getStringExtra(\"widget_action\");",
            "    if (act != null && !act.isEmpty()) getBridge().getWebView().postDelayed(() -> getBridge().getWebView().evaluateJavascript(\"if(window.handleWidgetLaunchAction) window.handleWidgetLaunchAction('\" + act + \"');\", null), 600);",
            "  }",
            "  public class SmartyJSBridge {",
            "    @JavascriptInterface public void setAllowedNotificationPackages(String csv) {",
            "      getSharedPreferences(\"smarty_allowed_pkgs\", MODE_PRIVATE).edit().putString(\"pkgs\", csv != null ? csv : \"\").apply();",
            "    }",
            "    @JavascriptInterface public String getAllowedNotificationPackages() {",
            "      return getSharedPreferences(\"smarty_allowed_pkgs\", MODE_PRIVATE).getString(\"pkgs\", \"\");",
            "    }",
            "    @JavascriptInterface public String getInstalledAppsJson() {",
            "      try {",
            "        PackageManager pm = getPackageManager();",
            "        Intent mainI = new Intent(Intent.ACTION_MAIN, null); mainI.addCategory(Intent.CATEGORY_LAUNCHER);",
            "        List<ResolveInfo> list = pm.queryIntentActivities(mainI, 0);",
            "        JSONArray arr = new JSONArray(); HashSet<String> seen = new HashSet<>();",
            "        for (ResolveInfo ri : list) {",
            "          if (ri.activityInfo == null) continue;",
            "          String pkg = ri.activityInfo.packageName;",
            "          if (pkg == null || pkg.equals(getPackageName()) || seen.contains(pkg)) continue;",
            "          seen.add(pkg);",
            "          String label = ri.loadLabel(pm) != null ? ri.loadLabel(pm).toString() : pkg;",
            "          JSONObject o = new JSONObject(); o.put(\"pkg\", pkg); o.put(\"name\", label); arr.put(o);",
            "        }",
            "        return arr.toString();",
            "      } catch (Exception e) { return \"[]\"; }",
            "    }",
            "    @JavascriptInterface public void updateHomeWidget(String rem, String spt, int pct) {",
            "      getSharedPreferences(\"smarty_widget_prefs\", MODE_PRIVATE).edit().putString(\"remaining\", rem).putString(\"spent\", spt).putInt(\"pct\", pct).apply();",
            "      SmartyWidgetProvider.updateAllWidgets(MainActivity.this);",
            "    }",
            "    @JavascriptInterface public boolean saveSingleOverwriteBackup(String json) {",
            "      try {",
            "        File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS); if (!dir.exists()) dir.mkdirs();",
            "        FileOutputStream fos = new FileOutputStream(new File(dir, \"SmartLifePro_Backup.json\"), false);",
            "        fos.write(json.getBytes(StandardCharsets.UTF_8)); fos.close(); return true;",
            "      } catch (Exception e) {",
            "        try { FileOutputStream fos2 = new FileOutputStream(new File(getExternalFilesDir(null), \"SmartLifePro_Backup.json\"), false); fos2.write(json.getBytes(StandardCharsets.UTF_8)); fos2.close(); return true; } catch (Exception ex) { return false; }",
            "      }",
            "    }",
            "    @JavascriptInterface public void printHtmlToPdf(final String html, final String job) {",
            "      runOnUiThread(() -> {",
            "        WebView wv = new WebView(MainActivity.this);",
            "        wv.setWebViewClient(new WebViewClient() { @Override public void onPageFinished(WebView v, String u) { PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE); pm.print(job, v.createPrintDocumentAdapter(job), new PrintAttributes.Builder().build()); pdfWebView = null; } });",
            "        wv.loadDataWithBaseURL(null, html, \"text/html\", \"UTF-8\", null); pdfWebView = wv;",
            "      });",
            "    }",
            "    @JavascriptInterface public void openNotificationSettings() { Intent i = new Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS); i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(i); }",
            "    @JavascriptInterface public boolean isNotificationListenerEnabled() { String f = Settings.Secure.getString(getContentResolver(), \"enabled_notification_listeners\"); return f != null && f.contains(getPackageName()); }",
            "    @JavascriptInterface public String getPendingNotificationsJson() { SharedPreferences p = getSharedPreferences(\"smarty_bank_queue\", MODE_PRIVATE); String q = p.getString(\"queue\", \"[]\"); p.edit().putString(\"queue\", \"[]\").apply(); return q; }",
            "    @JavascriptInterface public void postRealTestNotification(String t, String b) {",
            "      try {",
            "        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE); String chId = \"smarty_test_bank\";",
            "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) nm.createNotificationChannel(new NotificationChannel(chId, \"Prueba Bancaria\", NotificationManager.IMPORTANCE_HIGH));",
            "        nm.notify(7788, new NotificationCompat.Builder(MainActivity.this, chId).setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(t).setContentText(b).setPriority(NotificationCompat.PRIORITY_HIGH).setAutoCancel(true).build());",
            "      } catch (Exception ignored) {}",
            "    }",
            "    @JavascriptInterface public void pickRestoreFile() { Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType(\"*/*\"); startActivityForResult(i, PICK_RESTORE_JSON); }",
            "    @JavascriptInterface public void saveBackupFile(String json, String name) { pendingBackupContent = json; Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType(\"application/json\"); i.putExtra(Intent.EXTRA_TITLE, name); startActivityForResult(i, CREATE_BACKUP_JSON); }",
            "    @JavascriptInterface public void authenticateBiometric() {",
            "      runOnUiThread(() -> {",
            "        try {",
            "          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {",
            "            new BiometricPrompt.Builder(MainActivity.this).setTitle(\"Desbloquear Smart Life Pro\").setSubtitle(\"Usa tu huella o rostro\").setNegativeButton(\"Usar PIN\", getMainExecutor(), (d, w) -> {}).build().authenticate(new CancellationSignal(), getMainExecutor(), new BiometricPrompt.AuthenticationCallback() {",
            "              @Override public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult r) { getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(\"if(window.Main) Main.unlockApp();\", null)); }",
            "            });",
            "          }",
            "        } catch (Exception ignored) {}",
            "      });",
            "    }",
            "  }",
            "  @Override protected void onActivityResult(int req, int res, Intent d) {",
            "    super.onActivityResult(req, res, d);",
            "    if (req == PICK_RESTORE_JSON && res == Activity.RESULT_OK && d != null && d.getData() != null) {",
            "      try {",
            "        InputStream is = getContentResolver().openInputStream(d.getData()); BufferedReader r = new BufferedReader(new InputStreamReader(is, StandardCharsets.UTF_8));",
            "        StringBuilder sb = new StringBuilder(); String ln; while ((ln = r.readLine()) != null) sb.append(ln).append(\"\\n\"); r.close();",
            "        String b64 = Base64.encodeToString(sb.toString().getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);",
            "        getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(\"if(window._onAndroidBackupFileRestored) window._onAndroidBackupFileRestored(decodeURIComponent(escape(atob('\" + b64 + \"'))));\", null));",
            "      } catch (Exception ignored) {}",
            "    } else if (req == CREATE_BACKUP_JSON && res == Activity.RESULT_OK && d != null && d.getData() != null) {",
            "      try { OutputStream os = getContentResolver().openOutputStream(d.getData()); os.write(pendingBackupContent.getBytes(StandardCharsets.UTF_8)); os.close(); getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(\"if(window.UI) UI.showSnackbar('Copia guardada correctamente');\", null)); } catch (Exception ignored) {}",
            "    }",
            "  }",
            "  @Override protected void onCreate(Bundle s) {",
            "    super.onCreate(s); hideSysNav();",
            "    if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {",
            "      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA, Manifest.permission.POST_NOTIFICATIONS}, 101);",
            "    }",
            "    getBridge().getWebView().addJavascriptInterface(new SmartyJSBridge(), \"SmartyAndroid\");",
            "    handleWidget(getIntent());",
            "    bankReceiver = new BroadcastReceiver() {",
            "      @Override public void onReceive(Context c, Intent i) {",
            "        try {",
            "          getSharedPreferences(\"smarty_bank_queue\", MODE_PRIVATE).edit().putString(\"queue\", \"[]\").apply();",
            "          JSONObject o = new JSONObject(); o.put(\"package\", i.getStringExtra(\"package\")); o.put(\"title\", i.getStringExtra(\"title\")); o.put(\"text\", i.getStringExtra(\"text\"));",
            "          getBridge().getWebView().post(() -> getBridge().getWebView().evaluateJavascript(\"window.dispatchEvent(new CustomEvent('SmartyBankNotification', { detail: \" + o.toString() + \" }));\", null));",
            "        } catch (Exception ignored) {}",
            "      }",
            "    };",
            "    IntentFilter f = new IntentFilter(\"SMARTY_BANK_NOTIFICATION\");",
            "    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) registerReceiver(bankReceiver, f, Context.RECEIVER_NOT_EXPORTED); else registerReceiver(bankReceiver, f);",
            "  }",
            "  @Override public void onDestroy() { if (bankReceiver != null) unregisterReceiver(bankReceiver); super.onDestroy(); }",
            "}"
          ].join("\n"));

          let manifest = fs.readFileSync("android/app/src/main/AndroidManifest.xml", "utf8");
          if (!manifest.includes("QUERY_ALL_PACKAGES")) {
              manifest = manifest.replace("<application", "<uses-permission android:name=\"android.permission.QUERY_ALL_PACKAGES\" />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n    <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\n    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />\n    <uses-permission android:name=\"android.permission.USE_BIOMETRIC\" />\n    <uses-permission android:name=\"android.permission.USE_FINGERPRINT\" />\n    <application");
          }
          if (!manifest.includes("SmartyNotificationService")) {
              const svcs = [
                "<service android:name=\".SmartyNotificationService\" android:label=\"Smarty Lector Bancario\" android:exported=\"true\" android:permission=\"android.permission.BIND_NOTIFICATION_LISTENER_SERVICE\"><intent-filter><action android:name=\"android.service.notification.NotificationListenerService\" /></intent-filter></service>",
                "<receiver android:name=\".SmartyWidgetProvider\" android:exported=\"true\" android:label=\"Smarty Finanzas\"><intent-filter><action android:name=\"android.appwidget.action.APPWIDGET_UPDATE\" /></intent-filter><meta-data android:name=\"android.appwidget.provider\" android:resource=\"@xml/smarty_widget_info\" /></receiver>",
                "</application>"
              ].join("\n    ");
              manifest = manifest.replace("</application>", svcs);
          }
          fs.writeFileSync("android/app/src/main/AndroidManifest.xml", manifest);
          EOF_JAVA

          node setup_java.js
          rm -f setup_java.js

      - name: Compile Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLifePro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
