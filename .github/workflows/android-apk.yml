            "      this.flushPending(); window.SmartyUpdaterAndBackup.checkDailyAutoBackup();",
            "      document.addEventListener('visibilitychange', () => {",
            "        if (document.visibilityState === 'visible') { this.flushPending(); window.SmartyUpdaterAndBackup.checkDailyAutoBackup(); if (typeof UI !== 'undefined' && document.getElementById('android-pro-settings')) UI.renderSettingsView(); }",
            "      });",
            "    },",
            "    isListenerPermissionGranted() { try { return !!(window.SmartyAndroid && window.SmartyAndroid.isNotificationListenerEnabled()); } catch(_) { return false; } },",
            "    flushPending() { try { if (window.SmartyAndroid?.getPendingNotificationsJson) { const raw = window.SmartyAndroid.getPendingNotificationsJson(); if (raw && raw !== '[]') JSON.parse(raw).forEach(i => this.processBankNotification(i)); } } catch(_) {} },",
            "    toggleBiometricSetting(checked) {",
            "      if (checked && !Data.store.settings.pin) { UI.showSnackbar('Primero crea un PIN de respaldo'); Main.togglePinLock(); }",
            "      Data.store.settings.biometricEnabled = checked; Data.save();",
            "      if (checked && window.SmartyAndroid?.authenticateBiometric) window.SmartyAndroid.authenticateBiometric();",
            "    },",
            "    openNotificationAccessSettings() { if (window.SmartyAndroid?.openNotificationSettings) window.SmartyAndroid.openNotificationSettings(); },",
            "    async processBankNotification(notif) {",
            "      const title = String(notif.title || '').trim();",
            "      const text = String(notif.text || notif.body || '').trim();",
            "      const fullText = (title + ' - ' + text).trim(); if (fullText.length < 4) return;",
            "      this.lastCapturedText = fullText.slice(0, 75); localStorage.setItem('smarty_last_notif', this.lastCapturedText);",
            "      const logEl = document.getElementById('smarty-last-notif-log'); if (logEl) logEl.innerText = this.lastCapturedText;",
            "      if (!Data.store.settings?.bankAutoDetect) return;",
            "      const payRegex = /(compra|pago|pagaste|aprobada|aprovada|aprovado|aprobado|pix|transferencia|debito|credito|spent|paid|r\\$|\\$)/i;",
            "      if (!payRegex.test(fullText)) return;",
            "      const categories = ['cat_market','cat_leisure','cat_transport','cat_clothes','cat_health','cat_bills','cat_travel','cat_beauty','cat_other'];",
            "      let extracted = null;",
            "      if (Data.store.settings?.groqApiKey && typeof GroqAI !== 'undefined' && navigator.onLine) {",
            "        try {",
            "          const schema = { type: 'object', properties: { isRealExpense: { type: 'boolean' }, amount: { type: 'number' }, merchant: { type: 'string' }, category: { type: 'string', enum: categories } }, required: ['isRealExpense','amount','merchant','category'], additionalProperties: false };",
            "          const prompt = 'Analiza esta notificacion bancaria: Titulo=\"' + title + '\", Texto=\"' + text + '\". REGLA CRITICA: NUNCA pongas \"Compra aprobada\" ni \"Compra de credito aprobada\" como merchant. Extrae en merchant UNICAMENTE el comercio, tienda o destinatario que aparece despues del monto o despues de \"en\", \"em\", \"no\", \"para\". Categorias: ' + categories.join(', ');",
            "          extracted = await GroqAI.textJSON(prompt, fullText, 'bank_exp_v3', schema, { maxTokens: 350 });",
            "          if (!extracted.isRealExpense) return;",
            "        } catch(_) {}",
            "      }",
            "      if (!extracted || !extracted.amount || /(compra|aprovad|aprobad)/i.test(extracted.merchant || '')) {",
            "        extracted = extractCleanBankDataOffline(title, text);",
            "      }",
            "      const amount = Number(extracted.amount); if (!amount || amount <= 0) return;",
            "      const cleanDesc = String(extracted.merchant || 'Pago').trim();",
            "      const cat = categories.includes(extracted.category) ? extracted.category : 'cat_other';",
            "      if (Data.store.settings.bankAutoSaveMode === 'auto') {",
            "        Data.store.expenses.push({ id: Date.now().toString(), date: Date.now(), amount, desc: cleanDesc, category: UI.t(cat), isInstallment: false });",
            "        Data.save(); UI.renderBudgetChart(); Finance.renderHomeWidgets();",
            "        if (typeof Assistant !== 'undefined') Assistant.showReactivePopup('🏦 ' + cleanDesc + ': ' + UI.formatMoney(amount));",
            "      } else { Finance.openSmartExpenseModal(amount, cleanDesc, cat); }",
            "    },",
            "    sendRealTestNotificationToStatusBar() {",
            "      Data.store.settings.bankAutoDetect = true; Data.save();",
            "      if (!this.isListenerPermissionGranted()) { UI.showSnackbar('Primero activa el Permiso de Notificaciones'); this.openNotificationAccessSettings(); return; }",
            "      if (window.SmartyAndroid?.postRealTestNotification) {",
            "        UI.showSnackbar('📲 Probando notificación realista...');",
            "        window.SmartyAndroid.postRealTestNotification('Compra de crédito aprobada', 'Compra de crédito aprobada por $34.90 en Supermercado Carrefour con tu tarjeta final 4021');",
