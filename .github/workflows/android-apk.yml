            "  window.NativeBridge = {",
            "    lastCapturedText: 'Ninguna todavía',",
            "    init() {",
            "      if (!Data.store.settings) Data.store.settings = {};",
            "      if (typeof Data.store.settings.bankAutoDetect === 'undefined') Data.store.settings.bankAutoDetect = true;",
            "      if (typeof Data.store.settings.bankAutoSaveMode === 'undefined') Data.store.settings.bankAutoSaveMode = 'confirm';",
