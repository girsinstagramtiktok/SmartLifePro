                convert www/logo.png -resize 192x192 "PNG32:$d/ic_launcher_round.png"
                convert www/logo.png -resize 192x192 "PNG32:$d/ic_launcher_foreground.png"
              fi
            done
          fi

          if [ -f "www/idle.png" ]; then
            for d in android/app/src/main/res/mipmap-*; do
