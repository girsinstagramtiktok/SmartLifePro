name: Validar actualización ligera de Smarty (Vercel)
on:
  push:
    branches: [main]
    paths:
      - 'smarty-ota.js'
      - 'style.css'
      - 'assistant.js'
      - '.github/workflows/ota-web.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar código OTA ligero
        run: |
          node --check smarty-ota.js
          node --check assistant.js
          TZ=America/Sao_Paulo node smarty-tests.cjs
          node quick-ota-tests.cjs
      - name: Información
        run: echo "El sitio Vercel debe desplegar smarty-ota.js para que aparezca en el teléfono. Este workflow no publica el sitio."
